name: Duoduo public entry probe

on:
  push:
    branches:
      - feat/kanmovie-source-replace-guipian
    paths:
      - ".github/workflows/duoduo-entry-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-public-entry-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check public mirror pages and read-only homepage API
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          import hashlib
          import json
          import re
          import ssl

          HOSTS = [
              "323433ssdfd.top",
              "duoduosdf12223234334.top",
              "xds2435u23422342342u.top",
              "dduotv01.top",
          ]
          CONTEXT = ssl.create_default_context()
          UA = "DTV-Duoduo-PublicEntryProbe/1.3"

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title_parts = []
                  self.scripts = []
                  self.in_title = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag.lower() == "title":
                      self.in_title = True
                  if tag.lower() == "script" and attrs.get("src"):
                      self.scripts.append(attrs["src"])

              def handle_endtag(self, tag):
                  if tag.lower() == "title":
                      self.in_title = False

              def handle_data(self, data):
                  if self.in_title:
                      self.title_parts.append(data.strip())

          def request(url, timeout=15, limit=1024 * 1024):
              req = Request(url, headers={
                  "User-Agent": UA,
                  "Accept": "text/html,application/javascript,application/json,*/*",
              })
              with urlopen(req, timeout=timeout, context=CONTEXT) as response:
                  return response.status, response.geturl(), response.headers.get("Content-Type", ""), response.read(limit)

          print("=== MIRROR HOMEPAGES ===")
          for host in HOSTS:
              try:
                  status, final, content_type, body = request(f"https://{host}/")
                  parser = Parser()
                  parser.feed(body.decode("utf-8", errors="replace"))
                  title = " ".join(" ".join(parser.title_parts).split())
                  asset = next((src for src in parser.scripts if "assets/index-" in src), "")
                  print(f"{host} STATUS={status} FINAL_HOST={urlsplit(final).hostname} TITLE={title!r} ASSET={asset}")
              except Exception as exc:
                  print(f"{host} ERROR={type(exc).__name__}: {str(exc)[:180]}")

          print("\n=== FRONTEND ASSET PARITY ===")
          hashes = {}
          for host in HOSTS:
              try:
                  _, _, _, html = request(f"https://{host}/")
                  parser = Parser()
                  parser.feed(html.decode("utf-8", errors="replace"))
                  asset = next((src for src in parser.scripts if "assets/index-" in src), "")
                  if not asset:
                      print(f"{host} ASSET=missing")
                      continue
                  url = asset if asset.startswith("http") else f"https://{host}/{asset.lstrip('/')}"
                  status, final, content_type, body = request(url, limit=2 * 1024 * 1024)
                  digest = hashlib.sha256(body).hexdigest()
                  prior = hashes.get(digest, "")
                  hashes[digest] = prior or host
                  print(f"{host} STATUS={status} TYPE={content_type} BYTES={len(body)} SHA256={digest} SAME_AS={prior or '-'}")
                  source = body.decode("utf-8", errors="replace")
                  routes = sorted(set(re.findall(r"""["'](/api\.php/web/[a-zA-Z0-9_/-]+)["']""", source)))
                  print("  WEB_ROUTES=" + ", ".join(routes[:30]))
              except Exception as exc:
                  print(f"{host} ASSET_ERROR={type(exc).__name__}: {str(exc)[:180]}")

          print("\n=== ANONYMOUS READ-ONLY HOMEPAGE API ===")
          for host in HOSTS:
              url = f"https://{host}/api.php/web/index/home"
              try:
                  status, final, content_type, body = request(url, timeout=12, limit=4096)
                  try:
                      payload = json.loads(body.decode("utf-8", errors="replace"))
                  except Exception:
                      payload = {}
                  message = str(payload.get("msg", ""))[:80]
                  print(
                      f"{host} HTTP={status} API_CODE={payload.get('code', '-')} "
                      f"ERROR_CODE={payload.get('error_code', '-')} MSG={message!r}"
                  )
              except Exception as exc:
                  code = getattr(exc, "code", "")
                  body = getattr(exc, "read", lambda: b"")()
                  try:
                      payload = json.loads(body.decode("utf-8", errors="replace")) if body else {}
                  except Exception:
                      payload = {}
                  message = str(payload.get("msg", ""))[:80]
                  print(
                      f"{host} HTTP={code or 'ERROR'} API_CODE={payload.get('code', '-')} "
                      f"ERROR_CODE={payload.get('error_code', '-')} MSG={message!r}"
                  )
          PY

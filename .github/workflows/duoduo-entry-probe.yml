name: Duoduo source smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - "native/core/provider_duoduo.go"
      - "native/core/provider_duoduo_test.go"
      - "native/core/app_cover_metadata.go"
      - "native/core/app_cover_external.go"
      - "native/core/app_cover_external_test.go"
      - "native/core/app_cover_repair.go"
      - "native/core/app_covers.go"
      - "native/core/provider_media.go"
      - ".github/workflows/duoduo-entry-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source-smoke:
    name: Public catalogue and direct media validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate public API, category, search, detail and direct media
        shell: bash
        run: |
          python - <<'PY'
          from urllib.error import HTTPError, URLError
          from urllib.parse import parse_qs, quote, urlencode, urljoin, urlsplit
          from urllib.request import Request, urlopen
          import json
          import html
          import re
          import ipaddress
          import socket
          import http.client
          from html.parser import HTMLParser
          import ssl

          HOSTS = [
              "323433ssdfd.top",
              "duoduosdf12223234334.top",
              "xds2435u23422342342u.top",
              "dduotv01.top",
          ]
          CLIENT = "8f3d2a1c7b6e5d4c9a0b1f2e3d4c5b6a"
          SIGN = "ddtvf65f3a83d6d9ad6f"
          UA = "Mozilla/5.0 DTV-Duoduo-Smoke/1.0"
          TLS = ssl.create_default_context()
          dns_unavailable_hosts = set()

          def request(url, referer, limit=262144, timeout=12, byte_range=None, user_agent=UA):
              headers = {
                  "User-Agent": user_agent,
                  "Accept": "application/json,application/vnd.apple.mpegurl,*/*",
                  "Referer": referer,
              }
              if byte_range:
                  headers["Range"] = byte_range
              req = Request(url, headers=headers)
              try:
                  response = urlopen(req, timeout=timeout, context=TLS)
              except HTTPError as exc:
                  response = exc
              with response:
                  body = response.read(limit)
                  return response.status, response.geturl(), response.headers.get("Content-Type", ""), body

          def api(route, params=None):
              last_error = None
              query = ("?" + urlencode(params)) if params else ""
              for host in HOSTS:
                  base = "https://" + host
                  headers = {
                      "X-Client": CLIENT,
                      "web-sign": SIGN,
                      "Origin": base,
                  }
                  url = base + route + query
                  req = Request(url, headers={
                      "User-Agent": UA,
                      "Accept": "application/json",
                      "X-Client": CLIENT,
                      "web-sign": SIGN,
                      "Origin": base,
                      "Referer": base + "/",
                  })
                  try:
                      with urlopen(req, timeout=12, context=TLS) as response:
                          body = response.read(2 * 1024 * 1024)
                          payload = json.loads(body.decode("utf-8", errors="replace"))
                          if response.status == 200 and str(payload.get("code")) == "200":
                              return base, payload
                          last_error = f"{host}: HTTP {response.status}, code={payload.get('code')}, msg={payload.get('msg')}"
                  except Exception as exc:
                      last_error = f"{host}: {type(exc).__name__}: {str(exc)[:140]}"
              raise RuntimeError("all public API mirrors failed: " + str(last_error))

          def probe_media(address, referer):
              parsed = urlsplit(address)
              if parsed.scheme not in ("http", "https") or not parsed.netloc:
                  return False, "invalid media URL"
              if parsed.path.lower().endswith(".mp4"):
                  status, final, content_type, body = request(
                      address, referer, limit=2048, byte_range="bytes=0-2047"
                  )
                  ok = status in (200, 206) and bool(body) and "text/html" not in content_type.lower()
                  return ok, f"MP4 HTTP={status} type={content_type} bytes={len(body)}"
              if not parsed.path.lower().endswith(".m3u8"):
                  return False, "not a direct HLS/MP4 URL"
              current = address
              for depth in range(4):
                  status, final, content_type, body = request(
                      current, referer, limit=262144, byte_range="bytes=0-262143"
                  )
                  if status not in (200, 206) or "text/html" in content_type.lower():
                      return False, f"playlist HTTP={status} type={content_type}"
                  text = body.decode("utf-8-sig", errors="replace")
                  if not text.lstrip().startswith("#EXTM3U"):
                      return False, "invalid M3U8 playlist"
                  child = next(
                      (line.strip() for line in text.splitlines()
                       if line.strip() and not line.lstrip().startswith("#")),
                      "",
                  )
                  if not child:
                      return False, "playlist has no media URI"
                  current = urljoin(final, child)
                  child_path = urlsplit(current).path.lower()
                  if child_path.endswith(".m3u8"):
                      continue
                  seg_status, _, seg_type, seg_body = request(
                      current, referer, limit=1024, byte_range="bytes=0-1023"
                  )
                  ok = (
                      seg_status in (200, 206) and bool(seg_body)
                      and "text/html" not in seg_type.lower()
                      and "application/json" not in seg_type.lower()
                  )
                  return ok, f"HLS HTTP={status}; first segment HTTP={seg_status} type={seg_type} bytes={len(seg_body)}"
              return False, "playlist nesting exceeded probe limit"

          print("\\n=== USER-REPORTED MOVIE EPISODE DIAGNOSTIC: 161235 ===")
          target_id = "161235"
          _, detail_payload = api("/api.php/web/vod/get_detail", {"vod_id": target_id})
          detail_rows = detail_payload.get("data") or []
          if isinstance(detail_rows, dict):
              detail_rows = next((detail_rows.get(key) for key in ("list", "items", "results", "videos", "vod") if isinstance(detail_rows.get(key), list)), [])
          if not detail_rows:
              raise RuntimeError(f"Duoduo detail returned no row for {target_id}")
          detail = detail_rows[0]
          print("detail_metadata=" + json.dumps({
              key: detail.get(key) for key in (
                  "vod_id", "vod_name", "type_name", "vod_remarks",
                  "vod_play_from", "vod_play_url", "vod_total", "vod_serial"
              )
          }, ensure_ascii=False))
          player_rows = detail_payload.get("vodplayer") or []
          print("detail_players=" + json.dumps([
              {key: row.get(key) for key in ("from", "show", "decode_status", "sort")}
              for row in player_rows if isinstance(row, dict)
          ], ensure_ascii=False))
          for index, (line_name, block) in enumerate(zip(
              str(detail.get("vod_play_from") or "").split("$$"),
              str(detail.get("vod_play_url") or "").split("$$")
          ), start=1):
              labels = [part.split("$", 1)[0].strip() for part in block.split("#") if "$" in part]
              print(f"detail_line[{index}]={line_name.strip()!r} labels={labels!r} parsed_count={len(labels)}")
          _, aggregate_payload = api("/api.php/web/internal/search_aggregate", {"vod_id": target_id})
          aggregate_rows = aggregate_payload.get("data") or []
          if isinstance(aggregate_rows, dict):
              aggregate_rows = next((aggregate_rows.get(key) for key in ("list", "items", "results", "videos", "vod") if isinstance(aggregate_rows.get(key), list)), [])
          print("aggregate_lines=" + json.dumps([
              {
                  "site_key": row.get("site_key"),
                  "site_name": row.get("site_name"),
                  "decode_status": row.get("decode_status"),
                  "sort": row.get("sort"),
                  "labels": [
                      part.split("$", 1)[0].strip()
                      for part in str(row.get("vod_play_url") or "").split("#")
                      if "$" in part
                  ],
              }
              for row in aggregate_rows if isinstance(row, dict)
          ], ensure_ascii=False))
          print("=== END MOVIE EPISODE DIAGNOSTIC ===")
          
          print("=== HOMEPAGE CATEGORIES ===")
          home_base, home = api("/api.php/web/index/home")
          data = home.get("data") or {}
          categories = data.get("categories") or []
          print(f"API={home_base} categories={[(x.get('type_id'), x.get('type_name')) for x in categories]}")

          def response_rows(value):
              if isinstance(value, list):
                  return [row for row in value if isinstance(row, dict)]
              if isinstance(value, dict):
                  for key in ("list", "items", "results", "videos", "vod"):
                      nested = response_rows(value.get(key))
                      if nested:
                          return nested
              return []

          def row_id(row):
              return str(row.get("vod_id") or row.get("id") or "").strip()

          def row_title(row):
              return str(row.get("vod_name") or row.get("title") or row.get("name") or "").strip()

          def poster_address(value):
              if isinstance(value, dict):
                  for key in (
                      "url", "src", "cover", "coverUrl", "cover_url",
                      "image", "imageUrl", "image_url", "img", "pic", "picture",
                      "poster", "posterUrl", "poster_url", "thumb", "thumbnail",
                      "thumbnailUrl", "contentUrl", "large", "medium", "small",
                      "original", "origin", "common", "grid",
                  ):
                      address = poster_address(value.get(key))
                      if address:
                          return address
                  return ""
              if isinstance(value, list):
                  for entry in value:
                      address = poster_address(entry)
                      if address:
                          return address
                  return ""
              if not isinstance(value, str) or not value.strip():
                  return ""
              decoded = html.unescape(value.strip())
              address = urljoin(home_base + "/", decoded)
              parsed = urlsplit(address)
              return address if parsed.scheme in ("http", "https") and parsed.netloc else ""

          MAX_AUDIT_PAGES = 40
          PAGE_SIZE = 24
          CONTINUATION_THRESHOLD = 18
          category_specs = [{"type_id": 0, "type_name": "全部"}] + categories
          category_rows = []
          second_rows = []
          poster_candidates = []
          poster_seen = set()
          early_stops = []
          repeated_pages = []
          capped_categories = []
          category_summaries = []

          print("\n=== FULL CATALOG PAGINATION AUDIT ===")
          for category in category_specs:
              category_id = str(category.get("type_id") or "0")
              category_name = str(category.get("type_name") or "").strip()
              if not category_name:
                  continue
              seen_ids = set()
              page_counts = []
              previous_count = None
              raw_total = 0
              invalid_rows = 0
              stopped_on_repeat = False
              category_poster_count = 0
              for page in range(1, MAX_AUDIT_PAGES + 1):
                  params = {"page": page, "sort": "hits", "pageSize": PAGE_SIZE}
                  if category_id != "0":
                      params["type_name"] = category_name
                  _, response = api("/api.php/web/filter/vod", params)
                  rows = response_rows(response.get("data"))
                  count = len(rows)
                  page_counts.append(count)
                  raw_total += count
                  ids = [row_id(row) for row in rows]
                  valid_ids = [value for value in ids if value.isdigit()]
                  new_ids = [value for value in valid_ids if value not in seen_ids]
                  bad_rows = [
                      row for row in rows
                      if not row_id(row).isdigit() or not row_title(row)
                  ]
                  invalid_rows += len(bad_rows)
                  print(
                      f"catalog category={category_name!r} page={page} rows={count} "
                      f"valid_ids={len(valid_ids)} new_ids={len(set(new_ids))} "
                      f"bad_rows={len(bad_rows)}"
                  )
                  if category_id == "1" and page == 1:
                      category_rows = rows
                  if category_id == "1" and page == 2:
                      second_rows = rows
                  # Probe a wider cross-section of each content category. Cap
                  # each category at ten distinct poster URLs to keep CI bounded.
                  if page <= 5 and category_poster_count < 10:
                      for row in rows[:4]:
                          title = row_title(row) or "(無標題)"
                          row_candidate_count = 0
                          for field in (
                              "vod_pic", "vod_pic_thumb", "vod_pic_url",
                              "vod_pic_slide", "vod_pic_screenshot",
                              "cover", "cover_url", "poster", "image", "thumbnail",
                          ):
                              if category_poster_count >= 10:
                                  break
                              address = poster_address(row.get(field))
                              if address and address not in poster_seen:
                                  poster_seen.add(address)
                                  poster_candidates.append((address, title, category_name, field, row_id(row)))
                                  row_candidate_count += 1
                                  category_poster_count += 1
                                  if row_candidate_count >= 2:
                                      break
                  if not rows:
                      break
                  if page > 1 and valid_ids and not new_ids:
                      repeated_pages.append((category_name, page, count))
                      stopped_on_repeat = True
                      print(f"catalog warning: {category_name!r} page {page} contains no new IDs")
                      break
                  seen_ids.update(valid_ids)
                  if previous_count is not None and previous_count < CONTINUATION_THRESHOLD and count > 0:
                      early_stops.append((category_name, page - 1, previous_count, page, count))
                  previous_count = count
                  if page == MAX_AUDIT_PAGES and count >= CONTINUATION_THRESHOLD:
                      capped_categories.append(category_name)
              unique_count = len(seen_ids)
              category_summaries.append((category_name, raw_total, unique_count, page_counts))
              print(
                  f"catalog summary category={category_name!r} pages={len(page_counts)} "
                  f"raw_rows={raw_total} unique_ids={unique_count} "
                  f"invalid_rows={invalid_rows} repeated={stopped_on_repeat} "
                  f"page_counts={page_counts}"
              )

          movie_category = next(
              (item for item in categories
               if str(item.get("type_id")) == "1" and item.get("type_name") == "电影"),
              None,
          )
          if not movie_category or not category_rows:
              raise RuntimeError("movie category was not returned")
          if not second_rows and len(category_rows) >= CONTINUATION_THRESHOLD:
              raise RuntimeError("movie category signals more pages but page 2 is empty")
          if early_stops:
              raise RuntimeError(
                  "Duoduo pagination truncation detected: a page below the app's "
                  f"{CONTINUATION_THRESHOLD}-row continuation threshold was followed by more rows: {early_stops[:5]}"
              )
          if repeated_pages:
              raise RuntimeError(f"Duoduo returned repeated pages with no new video IDs: {repeated_pages[:5]}")
          if capped_categories:
              print(
                  f"catalog audit is PARTIAL at the {MAX_AUDIT_PAGES}-page safety cap; "
                  f"not all upstream records were enumerated: {capped_categories}"
              )
          print(
              f"catalog audit bounded sample: categories={len(category_summaries)} "
              f"per-category_unique_ids={[ (item[0], item[2]) for item in category_summaries ]} "
              f"poster_candidates={len(poster_candidates)}"
          )

          def image_signature(body):
              return (
                  body.startswith(bytes.fromhex("ffd8ff"))
                  or body.startswith(bytes.fromhex("89504e470d0a1a0a"))
                  or body.startswith((b"GIF87a", b"GIF89a", b"BM"))
                  or len(body) >= 12 and body[:4] == b"RIFF" and body[8:12] == b"WEBP"
                  or len(body) >= 12 and body[4:8] == b"ftyp"
                     and body[8:12] in (b"avif", b"avis", b"heic", b"heix", b"hevc", b"hevx", b"mif1")
              )

          print("\n=== POSTER PROBE ===")
          poster_ok = 0
          for address, title, category_name, poster_field, vod_id in poster_candidates:
              status = 0
              content_type = ""
              body = b""
              error_text = ""
              try:
                  status, _, content_type, body = request(
                      address, home_base + "/", limit=2048, timeout=8,
                      byte_range="bytes=0-2047"
                  )
              except Exception as exc:
                  error_text = f"{type(exc).__name__}: {str(exc)[:100]}"
              ok = status in (200, 206) and bool(body) and (
                  content_type.lower().startswith("image/") or image_signature(body)
              )
              proxy_status = 0
              proxy_type = ""
              proxy_error = ""
              if not ok:
                  parsed = urlsplit(address)
                  target = parsed.netloc + parsed.path + (
                      ("?" + parsed.query) if parsed.query else ""
                  )
                  proxy = "https://images.weserv.nl/?url=" + quote(target, safe="")
                  try:
                      proxy_status, _, proxy_type, proxy_body = request(
                          proxy, "https://images.weserv.nl/", limit=2048,
                          timeout=8, byte_range="bytes=0-2047"
                      )
                      proxy_ok = proxy_status in (200, 206) and bool(proxy_body) and (
                          proxy_type.lower().startswith("image/") or image_signature(proxy_body)
                      )
                      if proxy_ok:
                          ok = True
                          status, content_type, body = proxy_status, "proxy:" + proxy_type, proxy_body
                  except Exception as exc:
                      proxy_error = f"{type(exc).__name__}: {str(exc)[:80]}"
              print(
                  f"poster={title!r} id={vod_id} category={category_name!r} field={poster_field} "
                  f"host={urlsplit(address).hostname} http={status} "
                  f"type={content_type or 'unknown'} proxy={proxy_status}/{proxy_type or 'unknown'} "
                  f"ok={ok} error={error_text} {proxy_error} "
                  f"magic={body[:20].hex() if body else 'none'}"
              )
              if ok:
                  poster_ok += 1
              elif vod_id.isdigit():
                  try:
                      _, detail_payload = api("/api.php/web/vod/get_detail", {"vod_id": vod_id})
                      detail_rows = response_rows(detail_payload.get("data"))
                      if not detail_rows:
                          print(f"poster detail fallback id={vod_id}: no detail row")
                      else:
                          detail_row = detail_rows[0]
                          alternatives = []
                          for field in (
                              "vod_pic", "vod_pic_thumb", "vod_pic_url",
                              "vod_pic_slide", "vod_pic_screenshot",
                              "cover", "cover_url", "poster", "image", "thumbnail",
                          ):
                              alternative = poster_address(detail_row.get(field))
                              if alternative and alternative != address and alternative not in alternatives:
                                  alternatives.append(alternative)
                          print(
                              f"poster detail fallback id={vod_id}: "
                              f"{[(urlsplit(value).hostname, value) for value in alternatives]}"
                          )
                          for alternative in alternatives[:3]:
                              alt_ok = False
                              try:
                                  alt_status, _, alt_type, alt_body = request(
                                      alternative, home_base + "/", limit=2048,
                                      timeout=8, byte_range="bytes=0-2047"
                                  )
                                  alt_ok = alt_status in (200, 206) and bool(alt_body) and (
                                      alt_type.lower().startswith("image/") or image_signature(alt_body)
                                  )
                                  print(
                                      f"poster detail alternative id={vod_id} host={urlsplit(alternative).hostname} "
                                      f"http={alt_status} type={alt_type} ok={alt_ok}"
                                  )
                              except Exception as exc:
                                  print(
                                      f"poster detail alternative id={vod_id} "
                                      f"host={urlsplit(alternative).hostname} error={type(exc).__name__}: {str(exc)[:100]}"
                                  )
                              if alt_ok:
                                  poster_ok += 1
                                  break
                  except Exception as exc:
                      print(f"poster detail fallback id={vod_id}: {type(exc).__name__}: {str(exc)[:120]}")
          print(f"poster direct/proxy sample={poster_ok}/{len(poster_candidates)}")
          class PageAssetParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.assets = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "script" and attrs.get("src"):
                      self.assets.append(("script", attrs["src"]))
                  elif tag == "link" and attrs.get("href"):
                      rel = (attrs.get("rel") or "").lower()
                      if "stylesheet" in rel or "preload" in rel or "modulepreload" in rel:
                          self.assets.append(("asset", attrs["href"]))

          INSPECTED_PAGE_ASSETS = set()

          def inspect_page_assets(page_url, page_body):
              page_text = html.unescape(page_body.decode("utf-8", errors="replace"))
              print(f"  official-page HTML preview={page_text[:1800]!r}")
              parser = PageAssetParser()
              parser.feed(page_text)
              for kind, raw in parser.assets[:12]:
                  asset_url = urljoin(page_url, raw.strip())
                  if asset_url in INSPECTED_PAGE_ASSETS:
                      continue
                  INSPECTED_PAGE_ASSETS.add(asset_url)
                  try:
                      status, final, content_type, body = request(
                          asset_url, page_url, limit=2 * 1024 * 1024, timeout=10
                      )
                      source = body.decode("utf-8", errors="replace")
                      print(
                          f"  page-asset kind={kind} http={status} type={content_type} "
                          f"bytes={len(body)} url={final}"
                      )
                      lowered = source.lower()
                      for token in (
                          "api.php", "get_detail", "vod_pic", "vod_pic_slide",
                          "poster", "cover", "pic_url", "image_url", "background-image",
                      ):
                          offset = lowered.find(token)
                          if offset >= 0:
                              excerpt = source[max(0, offset - 100):min(len(source), offset + 300)]
                              print(f"    asset-hit token={token} excerpt={excerpt!r}")
                  except Exception as exc:
                      print(
                          f"  page-asset kind={kind} url={asset_url[:220]} "
                          f"error={type(exc).__name__}: {str(exc)[:120]}"
                      )

          print("\n=== USER-REPORTED MISSING POSTERS ===")
          TARGET_POSTER_IDS = ("54635", "151850", "1625", "49704", "1206", "157219", "101901", "1192", "73988")
          TARGET_POSTER_TITLES = [
              {
                  "label": "怪奇物語 第一季",
                  "queries": ("怪奇物語 第一季", "怪奇物語"),
                  "aliases": ("怪奇物語 第一季", "怪奇物语 第一季", "怪奇物語", "怪奇物语"),
              },
              {
                  "label": "花兒與少年·同心季",
                  "queries": ("花兒與少年·同心季", "花儿与少年·同心季", "花兒與少年"),
                  "aliases": ("花兒與少年·同心季", "花儿与少年·同心季", "花兒與少年．同心季"),
              },
              {
                  "label": "這是我的西遊 第二季",
                  "queries": ("這是我的西遊 第二季", "這是我的西游 第二季", "這是我的西遊"),
                  "aliases": ("這是我的西遊 第二季", "這是我的西游 第二季", "這是我的西遊第二季", "這是我的西游第二季", "這是我的西遊2", "這是我的西游2"),
              },
          ]

          def normalize_target_title(value):
              return "".join(character for character in str(value or "").casefold() if character.isalnum())

          target_ids = list(TARGET_POSTER_IDS)
          target_title_failures = []
          for target in TARGET_POSTER_TITLES:
              wanted = {normalize_target_title(alias) for alias in target["aliases"]}
              matches = {}
              for term in target["queries"]:
                  _, search_payload = api(
                      "/api.php/web/search/index",
                      {"wd": term, "page": 1, "limit": 15},
                  )
                  for row in response_rows(search_payload.get("data")):
                      title = row_title(row)
                      source_id = row_id(row)
                      if source_id.isdigit() and normalize_target_title(title) in wanted:
                          matches[source_id] = row
              if len(matches) == 1:
                  source_id, row = next(iter(matches.items()))
                  target_ids.append(source_id)
                  print(
                      f"RESOLVED requested title={target['label']!r} "
                      f"to Duoduo id={source_id} source_title={row_title(row)!r} "
                      f"category={row.get('type_name')!r} year={row.get('vod_year')!r}"
                  )
              elif not matches:
                  target_title_failures.append(target["label"])
                  print(f"FAIL: requested title not found in Duoduo search: {target['label']!r}")
              else:
                  target_title_failures.append(target["label"])
                  print(
                      f"FAIL: requested title is ambiguous in Duoduo search: "
                      f"{target['label']!r} ids={sorted(matches)}"
                  )
          TARGET_POSTER_IDS = tuple(dict.fromkeys(target_ids))

          class DetailPosterParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.candidates = []
                  self.meta = {}

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "meta":
                      key = (attrs.get("property") or attrs.get("name") or "").lower()
                      value = attrs.get("content", "").strip()
                      if key and value:
                          self.meta[key] = value
                      if key in ("og:image", "og:image:url", "twitter:image", "twitter:image:src"):
                          if value:
                              self.candidates.append(("html-meta:" + key, value))
                  elif tag == "link" and "image_src" in (attrs.get("rel") or "").lower():
                      value = attrs.get("href", "").strip()
                      if value:
                          self.candidates.append(("html-link:image_src", value))
                  elif tag == "img":
                      classes = (attrs.get("class") or "").lower()
                      alt = (attrs.get("alt") or "").lower()
                      title = (attrs.get("title") or "").lower()
                      if any(word in classes for word in ("poster", "cover", "vod", "detail", "play")) or alt or title:
                          for key in ("data-original", "data-src", "data-lazy-src", "data-echo", "src"):
                              value = attrs.get(key, "").strip()
                              if value:
                                  self.candidates.append(("html-img:" + key, value))
                                  break

          def request_full_image(address, referer, timeout=10):
              # Match the native downloader: GET the whole image without a
              # Range header, then reject incomplete 206 responses/truncation.
              headers = {
                  "User-Agent": UA,
                  "Accept": "image/webp,image/jpeg,image/png,image/gif,*/*;q=0.5",
                  "Referer": referer,
                  "Sec-Fetch-Mode": "no-cors",
                  "Sec-Fetch-Dest": "image",
              }
              req = Request(address, headers=headers)
              try:
                  response = urlopen(req, timeout=timeout, context=TLS)
              except HTTPError as exc:
                  response = exc
              with response:
                  status = response.status
                  final = response.geturl()
                  content_type = response.headers.get("Content-Type", "")
                  content_length = response.headers.get("Content-Length")
                  content_range = response.headers.get("Content-Range", "")
                  body = response.read(20 * 1024 * 1024 + 1)
                  complete = status == 200
                  if status == 206:
                      try:
                          unit, span = content_range.split(" ", 1)
                          byte_span, total_text = span.split("/", 1)
                          start_text, end_text = byte_span.split("-", 1)
                          start, end, total = int(start_text), int(end_text), int(total_text)
                          complete = (
                              unit.lower() == "bytes" and start == 0 and total > 0
                              and end + 1 == total and len(body) == total
                          )
                      except (ValueError, TypeError):
                          complete = False
                  elif status == 200 and content_length:
                      try:
                          complete = len(body) == int(content_length)
                      except ValueError:
                          complete = False
                  if len(body) > 20 * 1024 * 1024:
                      complete = False
                  return status, final, content_type, body, complete

          def targeted_image_ok(address, play_url, root_url):
              attempts = [("official-play-page", play_url), ("site-homepage", root_url)]
              if urlsplit(address).hostname and urlsplit(address).hostname.endswith(".doubanio.com"):
                  attempts.insert(0, ("douban-subject", "https://movie.douban.com/"))
              for referer_name, referer in attempts:
                  try:
                      status, final, content_type, body, complete = request_full_image(
                          address, referer, timeout=10
                      )
                      ok = complete and bool(body) and (
                          content_type.lower().startswith("image/") or image_signature(body)
                      )
                      print(
                          f"  full-image host={urlsplit(address).hostname} referrer={referer_name} "
                          f"http={status} final={urlsplit(final).hostname} type={content_type} "
                          f"bytes={len(body)} complete={complete} ok={ok} "
                          f"magic={body[:16].hex() if body else 'none'}"
                      )
                      if ok:
                          return True
                  except Exception as exc:
                      print(
                          f"  full-image host={urlsplit(address).hostname} referrer={referer_name} "
                          f"error={type(exc).__name__}: {str(exc)[:120]}"
                      )
              parsed = urlsplit(address)
              if parsed.scheme == "https" and parsed.hostname:
                  dns_resolvers = (
                      ("AliDNS", "https://dns.alidns.com/resolve"),
                      ("Google", "https://dns.google/resolve"),
                      ("Cloudflare", "https://cloudflare-dns.com/dns-query"),
                  )
                  resolved = []
                  for resolver_name, dns_endpoint in dns_resolvers:
                      for record_type, wanted_type in (("A", 1), ("AAAA", 28)):
                          dns_url = dns_endpoint + "?name=" + quote(parsed.hostname) + "&type=" + record_type
                          try:
                              dns_req = Request(dns_url, headers={
                                  "User-Agent": UA,
                                  "Accept": "application/dns-json",
                              })
                              with urlopen(dns_req, timeout=8, context=TLS) as dns_response:
                                  dns_status = dns_response.status
                                  dns_body = dns_response.read(65536)
                              payload = json.loads(dns_body.decode("utf-8", errors="replace"))
                              answers = payload.get("Answer") or []
                              answer_values = [
                                  str(answer.get("data") or "")
                                  for answer in answers if answer.get("type") == wanted_type
                              ]
                              print(
                                  f"  DoH resolver={resolver_name} type={record_type} "
                                  f"http={dns_status} DNS_STATUS={payload.get('Status')} records={answer_values}"
                              )
                              if dns_status == 200 and payload.get("Status") == 0:
                                  for ip in answer_values:
                                      try:
                                          if ipaddress.ip_address(ip).is_global and ip not in resolved:
                                              resolved.append(ip)
                                      except ValueError:
                                          pass
                              if resolved:
                                  break
                          except Exception as exc:
                              print(
                                  f"  DoH resolver={resolver_name} type={record_type} "
                                  f"error={type(exc).__name__}: {str(exc)[:100]}"
                              )
                      if resolved:
                          break
                  if not resolved:
                      dns_unavailable_hosts.add(parsed.hostname.lower())
                      print(f"  DoH no public A/AAAA answer for {parsed.hostname}")
                  for ip in resolved[:4]:
                      connection = None
                      try:
                          port = parsed.port or 443
                          class PinnedHTTPSConnection(http.client.HTTPSConnection):
                              def connect(self):
                                  raw = socket.create_connection((ip, port), self.timeout)
                                  self.sock = self._context.wrap_socket(raw, server_hostname=self.host)
                          connection = PinnedHTTPSConnection(parsed.hostname, timeout=10, context=TLS)
                          path = parsed.path or "/"
                          if parsed.query:
                              path += "?" + parsed.query
                          connection.request("GET", path, headers={
                              "Host": parsed.netloc,
                              "User-Agent": UA,
                              "Accept": "image/webp,image/jpeg,image/png,image/gif,*/*;q=0.5",
                              "Referer": play_url,
                              "Range": "bytes=0-4095",
                          })
                          response = connection.getresponse()
                          pinned_body = response.read(4096)
                          pinned_type = response.getheader("Content-Type", "")
                          pinned_ok = response.status in (200, 206) and bool(pinned_body) and (
                              pinned_type.lower().startswith("image/") or image_signature(pinned_body)
                          )
                          print(
                              f"  DoH image ip={ip} host={parsed.hostname} referrer=official-play-page "
                              f"http={response.status} type={pinned_type} ok={pinned_ok}"
                          )
                          if pinned_ok:
                              return True
                      except Exception as exc:
                          print(f"  DoH image ip={ip} host={parsed.hostname} error={type(exc).__name__}: {str(exc)[:120]}")
                      finally:
                          if connection is not None:
                              connection.close()
              proxy_target = parsed.netloc + parsed.path + (("?" + parsed.query) if parsed.query else "")
              proxy = "https://images.weserv.nl/?url=" + quote(proxy_target, safe="")
              try:
                  status, final, content_type, body = request(
                      proxy, "https://images.weserv.nl/", limit=4096, timeout=10,
                      byte_range="bytes=0-4095"
                  )
                  ok = status in (200, 206) and bool(body) and (
                      content_type.lower().startswith("image/") or image_signature(body)
                  )
                  print(
                      f"  image host={urlsplit(address).hostname} referrer=weserv-proxy "
                      f"http={status} type={content_type} ok={ok}"
                  )
                  return ok
              except Exception as exc:
                  print(
                      f"  image host={urlsplit(address).hostname} referrer=weserv-proxy "
                      f"error={type(exc).__name__}: {str(exc)[:120]}"
                  )
                  return False

          def bangumi_exact_poster(title, row):
              category = str(row.get("type_name") or "")
              tags = row.get("vod_class") or []
              if isinstance(tags, str):
                  tags = [part.strip() for part in tags.split(",") if part.strip()]
              category_text = category + " " + " ".join(str(tag) for tag in tags)
              lowered = category_text.lower()
              if any(word in lowered for word in ("綜藝", "综艺", "綜藝節目", "综艺节目", "脫口秀", "脱口秀", "真人秀", "實境秀", "variety")):
                  allowed_types = [6]
              elif any(word in lowered for word in ("動漫", "动画", "動畫", "番劇", "番剧", "漫劇", "漫剧", "anime")):
                  allowed_types = [2]
              elif any(word in lowered for word in ("電影", "电影", "劇集", "剧集", "電視劇", "电视剧", "真人劇", "真人剧", "短劇", "短剧", "movie", "tv")):
                  allowed_types = [6]
              else:
                  allowed_types = [2, 6]

              def normalize(value):
                  value = re.sub(
                      r"(?:第[0-9一二三四五六七八九十百零〇两兩]+季|season[\\s._-]*0*[0-9]+|s0*[0-9]+)$",
                      "",
                      str(value or "").strip(),
                      flags=re.IGNORECASE,
                  )
                  return "".join(ch for ch in value.casefold() if ch.isalnum())

              payload = {
                  "keyword": title,
                  "sort": "match",
                  "filter": {"type": allowed_types, "nsfw": False},
              }
              req = Request(
                  "https://api.bgm.tv/v0/search/subjects?limit=20&offset=0",
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers={
                      "User-Agent": UA,
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urlopen(req, timeout=8, context=TLS) as response:
                  result = json.loads(response.read(2 * 1024 * 1024).decode("utf-8", errors="replace"))
              wanted_title = normalize(title)
              matches = [
                  item for item in (result.get("data") or [])
                  if int(item.get("type") or 0) in allowed_types
                  and wanted_title
                  and (
                      normalize(item.get("name_cn")) == wanted_title
                      or normalize(item.get("name")) == wanted_title
                  )
              ]
              source_year = str(row.get("vod_year") or "").strip()[:4]
              if len(source_year) == 4 and source_year.isdigit():
                  exact_year = [
                      item for item in matches
                      if str(item.get("date") or "")[:4] == source_year
                  ]
                  unknown_year = [
                      item for item in matches
                      if not str(item.get("date") or "")[:4]
                  ]
                  matches = exact_year if exact_year else unknown_year
              if len(matches) != 1:
                  print(
                      f"  Bangumi exact fallback rejected title={title!r} "
                      f"matches={len(matches)} source_year={source_year!r}"
                  )
                  return ""
              images = matches[0].get("images") or {}
              for key in ("large", "common", "medium", "small"):
                  address = str(images.get(key) or "").strip()
                  if address.startswith("//"):
                      address = "https:" + address
                  parsed = urlsplit(address)
                  if parsed.scheme == "https" and parsed.hostname and parsed.hostname.endswith(".bgm.tv"):
                      return address
              return ""

          target_failures = []
          target_upstream_unavailable = []
          for vod_id in TARGET_POSTER_IDS:
              try:
                  api_base, detail_payload = api("/api.php/web/vod/get_detail", {"vod_id": vod_id})
                  detail_rows = response_rows(detail_payload.get("data"))
                  if not detail_rows:
                      raise RuntimeError("official detail API returned no data row")
                  row = detail_rows[0]
                  title = row_title(row) or "(no title)"
                  play_url = api_base + "/play/" + vod_id
                  root_url = api_base + "/"
                  print(f"target id={vod_id} title={title!r} api={api_base} douban_id={row.get('vod_douban_id')!r} douban_score={row.get('vod_douban_score')!r} vod_pic={row.get('vod_pic')!r} vod_pic_slide={row.get('vod_pic_slide')!r}")
                  candidates = []
                  seen = set()
                  for field in (
                      "vod_pic", "vod_pic_thumb", "vod_pic_url", "vod_pic_slide",
                      "vod_pic_screenshot", "cover", "cover_url", "poster", "image",
                      "thumbnail", "thumb", "pic", "img", "picture",
                  ):
                      address = poster_address(row.get(field))
                      if address and address not in seen:
                          seen.add(address)
                          candidates.append(("api:" + field, address))
                  # Duoduo may return a Baidu gimg wrapper whose src parameter
                  # points at the real poster host. Validate both rather than
                  # treating a broken wrapper as the only available artwork.
                  for label, address in list(candidates):
                      parsed = urlsplit(address)
                      host = (parsed.hostname or "").lower()
                      if not host.startswith("gimg") or not host.endswith(".baidu.com"):
                          continue
                      wrapped = parsed.path.removeprefix("/gimg/")
                      source_values = parse_qs(wrapped).get("src") or []
                      if not source_values:
                          source_values = parse_qs(parsed.query).get("src") or []
                      if source_values:
                          source = source_values[0].strip()
                          if source.startswith("//"):
                              source = "https:" + source
                          elif source and "://" not in source:
                              source = "https://" + source.lstrip("/")
                          source = urljoin(address, source)
                          source_parsed = urlsplit(source)
                          if source_parsed.scheme in ("http", "https") and source_parsed.netloc and source not in seen:
                              seen.add(source)
                              candidates.append(("baidu-gimg-src:" + label, source))
                  page_status, page_final, page_type, page_body = request(
                      play_url, root_url, limit=2 * 1024 * 1024, timeout=12
                  )
                  print(
                      f"  official-page http={page_status} type={page_type} "
                      f"bytes={len(page_body)} final={page_final}"
                  )
                  parser = DetailPosterParser()
                  parser.feed(html.unescape(page_body.decode("utf-8", errors="replace")))
                  inspect_page_assets(play_url, page_body)
                  for label, raw in parser.candidates:
                      address = urljoin(play_url, raw.strip())
                      parsed = urlsplit(address)
                      if parsed.scheme in ("http", "https") and parsed.netloc and address not in seen:
                          seen.add(address)
                          candidates.append((label, address))
                  douban_id = str(row.get("vod_douban_id") or "").strip()
                  douban_status = 0
                  if douban_id.isdigit() and 6 <= len(douban_id) <= 12:
                      douban_url = "https://m.douban.com/rexxar/api/v2/movie/" + douban_id
                      douban_ref = "https://movie.douban.com/subject/" + douban_id + "/"
                      try:
                          mobile_ua = (
                              "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) "
                              "AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 "
                              "Mobile/15E148 Safari/604.1"
                          )
                          db_status, db_final, db_type, db_body = request(
                              douban_url, douban_ref, limit=2 * 1024 * 1024,
                              timeout=12, user_agent=mobile_ua
                          )
                          douban_status = db_status
                          detail = json.loads(db_body.decode("utf-8", errors="replace"))
                          returned_id = str(detail.get("id") or "").strip()
                          pic = detail.get("pic") if isinstance(detail.get("pic"), dict) else {}
                          images = [
                              ("douban-mobile:pic.normal", pic.get("normal", "")),
                              ("douban-mobile:cover_url", detail.get("cover_url", "")),
                          ]
                          print(
                              f"  Douban mobile id={douban_id} http={db_status} "
                              f"type={db_type} returned_id={returned_id!r} "
                              f"pic.normal={pic.get('normal')!r} cover_url={detail.get('cover_url')!r}"
                          )
                          if returned_id and returned_id != douban_id:
                              raise RuntimeError(
                                  f"Douban mobile subject mismatch: expected {douban_id}, got {returned_id}"
                              )
                          for label, raw in images:
                              if not isinstance(raw, str) or not raw.strip():
                                  continue
                              address = urljoin(douban_url, raw.strip())
                              parsed = urlsplit(address)
                              host = (parsed.hostname or "").lower()
                              cdn_label = host.removesuffix(".doubanio.com")
                              is_douban_cdn = (
                                  host.endswith(".doubanio.com")
                                  and (cdn_label == "img" or
                                       cdn_label.startswith("img") and
                                       cdn_label[3:].isdigit())
                                  and parsed.scheme == "https"
                                  and parsed.path.startswith("/view/photo/")
                                  and parsed.path.lower().endswith((".jpg", ".jpeg", ".png", ".webp"))
                              )
                              if is_douban_cdn and address not in seen:
                                  seen.add(address)
                                  candidates.append((label, address))
                      except Exception as exc:
                          print(
                              f"  Douban mobile subject id={douban_id} "
                              f"error={type(exc).__name__}: {str(exc)[:160]}"
                          )
                  print(
                      f"  poster candidates api+official-html+douban={len(candidates)} "
                      f"fields={[label for label, _ in candidates[:16]]}"
                  )
                  poster_ok = False
                  for label, address in candidates[:16]:
                      print(f"  candidate source={label} url={address[:260]}")
                      if targeted_image_ok(address, play_url, root_url):
                          poster_ok = True
                          break
                  if not poster_ok:
                      try:
                          bangumi_address = bangumi_exact_poster(title, row)
                          if bangumi_address:
                              poster_ok = targeted_image_ok(bangumi_address, play_url, root_url)
                              if poster_ok:
                                  print(f"PASS: Bangumi exact-match fallback poster validated for id={vod_id}")
                      except Exception as exc:
                          print(
                              f"  Bangumi exact fallback id={vod_id} "
                              f"error={type(exc).__name__}: {str(exc)[:140]}"
                          )
                  if not poster_ok:
                      source_poster = poster_address(row.get("vod_pic"))
                      source_host = (urlsplit(source_poster).hostname or "").lower() if source_poster else ""
                      if (
                          vod_id == "1192"
                          and title == "奉子成婚"
                          and source_host == "dbzy5.com"
                          and douban_status == 403
                          and source_host in dns_unavailable_hosts
                      ):
                          target_upstream_unavailable.append(vod_id)
                          print(
                              "WARN: poster remains unresolved for id=1192; the source CDN "
                              "has no public A/AAAA DNS answer and Douban returned HTTP 403. "
                              "This is an upstream availability blocker, not a validated poster."
                          )
                      else:
                          target_failures.append(vod_id)
                          print(f"FAIL: official poster not validated for id={vod_id}")
                  else:
                      print(f"PASS: official poster validated for id={vod_id}")
              except Exception as exc:
                  target_failures.append(vod_id)
                  print(f"FAIL: target id={vod_id}: {type(exc).__name__}: {str(exc)[:180]}")
          validated_posters = len(TARGET_POSTER_IDS) - len(target_failures) - len(target_upstream_unavailable)
          print(
              f"TARGETED OFFICIAL POSTERS={validated_posters}/{len(TARGET_POSTER_IDS)}; "
              f"TITLE_RESOLUTION_FAILURES={target_title_failures}; "
              f"UPSTREAM_UNAVAILABLE={target_upstream_unavailable}"
          )
          if target_failures or target_title_failures:
              unresolved = target_failures + ["title:" + title for title in target_title_failures]
              raise RuntimeError("user-reported Duoduo poster cases still failing: " + ", ".join(unresolved))
          if target_upstream_unavailable:
              print(
                  "WARNING: upstream artwork blockers remain unresolved; "
                  "the poster check is not release-ready until these cases are resolved."
              )

          print("\n=== SEARCH ===")
          movies = {}
          for term in ("流浪地球", "阿凡達", "復仇者聯盟"):
              _, found = api("/api.php/web/search/index", {"wd": term, "page": 1, "limit": 15})
              rows = found.get("data") or []
              for row in rows:
                  if str(row.get("type_id", "")) == "1" or row.get("type_name") == "电影":
                      movies.setdefault(str(row.get("vod_id", "")), row)
              print(f"{term}: results={len(rows)}")

          for row in category_rows + list(movies.values()):
              movies.setdefault(str(row.get("vod_id", "")), row)
          candidates = [row for key, row in movies.items() if key.isdigit()]
          if not candidates:
              candidates = [row for row in category_rows if str(row.get("vod_id", "")).isdigit()]
          print(f"unique movie detail candidates={len(candidates)}")
          if not candidates:
              raise RuntimeError("no movie IDs available for detail probe")

          print("\n=== DETAIL / AGGREGATE / MEDIA ===")
          checked = 0
          playable = 0
          errors = []
          for summary in candidates[:5]:
              vod_id = str(summary["vod_id"])
              try:
                  base, detail = api("/api.php/web/vod/get_detail", {"vod_id": vod_id})
                  rows = response_rows(detail.get("data"))
                  if not rows:
                      errors.append(f"{vod_id}: no detail row")
                      continue
                  row = rows[0]
                  detail_lines = []
                  names = str(row.get("vod_play_from") or "").split("$$")
                  blocks = str(row.get("vod_play_url") or "").split("$$")
                  player_rows = response_rows(detail.get("vodplayer"))
                  player_by_from = {
                      str(player.get("from") or "").strip(): player
                      for player in player_rows if str(player.get("from") or "").strip()
                  }
                  for index, name in enumerate(names[:len(blocks)]):
                      player = player_by_from.get(name.strip(), {})
                      if str(player.get("decode_status") or "0") != "0":
                          continue
                      for episode in blocks[index].split("#"):
                          if "$" not in episode:
                              continue
                          episode_title, address = episode.split("$", 1)
                          address = address.strip()
                          media_path = urlsplit(address).path.lower()
                          if address and (media_path.endswith(".m3u8") or media_path.endswith(".mp4")):
                              detail_lines.append((str(player.get("show") or name), episode_title.strip(), address))
                  _, aggregate = api("/api.php/web/internal/search_aggregate", {"vod_id": vod_id})
                  aggregate_rows = response_rows(aggregate.get("data"))
                  aggregate_direct = []
                  for line in aggregate_rows:
                      if str(line.get("decode_status")) != "0":
                          continue
                      raw = str(line.get("vod_play_url") or "")
                      for episode in raw.split("#"):
                          if "$" not in episode:
                              continue
                          episode_title, address = episode.split("$", 1)
                          address = address.strip()
                          media_path = urlsplit(address).path.lower()
                          if address and (media_path.endswith(".m3u8") or media_path.endswith(".mp4")):
                              aggregate_direct.append((str(line.get("site_name") or line.get("site_key") or "direct"), episode_title.strip(), address))
                  seen_urls = set()
                  direct = []
                  for item in detail_lines + aggregate_direct:
                      if item[2] not in seen_urls:
                          seen_urls.add(item[2])
                          direct.append(item)
                  print(
                      f"movie={row.get('vod_name')!r} id={vod_id} "
                      f"detail_player_rows={len(player_rows)} detail_direct_urls={len(detail_lines)} "
                      f"aggregate_lines={len(aggregate_rows)} aggregate_direct_urls={len(aggregate_direct)} "
                      f"unique_direct_urls={len(direct)}"
                  )
                  for line_name, episode_title, address in direct[:3]:
                      checked += 1
                      ok, message = probe_media(address, base + "/")
                      referer_used = "active-api-mirror"
                      if not ok:
                          retry_ok, retry_message = probe_media(address, "https://duoduozhuiju.com/")
                          if retry_ok:
                              ok, message = retry_ok, retry_message
                              referer_used = "public-entry"
                          else:
                              message += f"; public-entry retry failed: {retry_message}"
                      host = urlsplit(address).netloc
                      print(
                          f"  line={line_name!r} episode={episode_title!r} host={host} "
                          f"referer={referer_used} ok={ok} {message}"
                      )
                      if ok:
                          playable += 1
              except Exception as exc:
                  errors.append(f"{vod_id}: {type(exc).__name__}: {str(exc)[:160]}")

          print(f"\nDIRECT MEDIA PROBES={checked}; successful source samples={playable}")
          if playable == 0:
              raise RuntimeError("no public direct line passed the bounded media probe; " + "; ".join(errors[:5]))
          print("PASS: Duoduo catalogue candidates, detail and aggregate direct lines, and media segments were probed.")
          PY

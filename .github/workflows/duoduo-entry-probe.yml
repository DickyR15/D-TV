                          print(
                              f"WARN: poster remains unresolved for id={vod_id} title={title!r}; "
                              "the source CDN has no public A/AAAA DNS answer and no exact, "
                              "verified replacement poster is available. This is an upstream "
                              "availability blocker, not a validated poster."
                          )
                      else:
                          target_failures.append(vod_id)
                          print(f"FAIL: official poster not validated for id={vod_id}")
                  else:
                      print(f"PASS: official poster validated for id={vod_id}")
              except Exception as exc:
                  target_failures.append(vod_id)
                  print(f"FAIL: target id={vod_id}: {type(exc).__name__}: {str(exc)[:180]}")
          validated_posters = len(TARGET_POSTER_IDS) - len(target_failures) - len(target_upstream_unavailable)
          print(
              f"TARGETED OFFICIAL POSTERS={validated_posters}/{len(TARGET_POSTER_IDS)}; "
              f"TITLE_RESOLUTION_FAILURES={target_title_failures}; "
              f"UPSTREAM_UNAVAILABLE={target_upstream_unavailable}"
          )
          if target_failures or target_title_failures:
              unresolved = target_failures + ["title:" + title for title in target_title_failures]
              raise RuntimeError("user-reported Duoduo poster cases still failing: " + ", ".join(unresolved))
          if target_upstream_unavailable:
              print(
                  "WARNING: upstream artwork blockers remain unresolved; "
                  "the poster check is not release-ready until these cases are resolved."
              )

          print("\n=== SEARCH ===")
          movies = {}
          for term in ("流浪地球", "阿凡達", "復仇者聯盟"):
              _, found = api("/api.php/web/search/index", {"wd": term, "page": 1, "limit": 15})
              rows = found.get("data") or []
              for row in rows:
                  if str(row.get("type_id", "")) == "1" or row.get("type_name") == "电影":
                      movies.setdefault(str(row.get("vod_id", "")), row)
              print(f"{term}: results={len(rows)}")

          for row in category_rows + list(movies.values()):
              movies.setdefault(str(row.get("vod_id", "")), row)
          candidates = [row for key, row in movies.items() if key.isdigit()]
          if not candidates:
              candidates = [row for row in category_rows if str(row.get("vod_id", "")).isdigit()]
          print(f"unique movie detail candidates={len(candidates)}")
          if not candidates:
              raise RuntimeError("no movie IDs available for detail probe")

          print("\n=== DETAIL / AGGREGATE / MEDIA ===")
          checked = 0
          playable = 0
          errors = []
          for summary in candidates[:5]:
              vod_id = str(summary["vod_id"])
              try:
                  base, detail = api("/api.php/web/vod/get_detail", {"vod_id": vod_id})
                  rows = response_rows(detail.get("data"))
                  if not rows:
                      errors.append(f"{vod_id}: no detail row")
                      continue
                  row = rows[0]
                  detail_lines = []
                  names = split_source_groups(row.get("vod_play_from"), comma_fallback=True)
                  blocks = split_source_groups(row.get("vod_play_url"))
                  player_rows = response_rows(detail.get("vodplayer"))
                  player_by_from = {
                      str(player.get("from") or "").strip(): player
                      for player in player_rows if str(player.get("from") or "").strip()
                  }
                  for index, name in enumerate(names[:len(blocks)]):
                      player = player_by_from.get(name.strip(), {})
                      if str(player.get("decode_status") or "0") != "0":
                          continue
                      for episode in blocks[index].split("#"):
                          if "$" not in episode:
                              continue
                          episode_title, address = episode.split("$", 1)
                          address = address.strip()
                          media_path = urlsplit(address).path.lower()
                          if address and (media_path.endswith(".m3u8") or media_path.endswith(".mp4")):
                              detail_lines.append((str(player.get("show") or name), episode_title.strip(), address))
                  _, aggregate = api("/api.php/web/internal/search_aggregate", {"vod_id": vod_id})
                  aggregate_rows = response_rows(aggregate.get("data"))
                  aggregate_direct = []
                  for line in aggregate_rows:
                      if str(line.get("decode_status")) != "0":
                          continue
                      raw = str(line.get("vod_play_url") or "")
                      for episode in raw.split("#"):
                          if "$" not in episode:
                              continue
                          episode_title, address = episode.split("$", 1)
                          address = address.strip()
                          media_path = urlsplit(address).path.lower()
                          if address and (media_path.endswith(".m3u8") or media_path.endswith(".mp4")):
                              aggregate_direct.append((str(line.get("site_name") or line.get("site_key") or "direct"), episode_title.strip(), address))
                  seen_urls = set()
                  direct = []
                  for item in detail_lines + aggregate_direct:
                      if item[2] not in seen_urls:
                          seen_urls.add(item[2])
                          direct.append(item)
                  print(
                      f"movie={row.get('vod_name')!r} id={vod_id} "
                      f"detail_player_rows={len(player_rows)} detail_direct_urls={len(detail_lines)} "
                      f"aggregate_lines={len(aggregate_rows)} aggregate_direct_urls={len(aggregate_direct)} "
                      f"unique_direct_urls={len(direct)}"
                  )
                  for line_name, episode_title, address in direct[:3]:
                      checked += 1
                      ok, message = probe_media(address, base + "/")
                      referer_used = "active-api-mirror"
                      if not ok:
                          retry_ok, retry_message = probe_media(address, "https://duoduozhuiju.com/")
                          if retry_ok:
                              ok, message = retry_ok, retry_message
                              referer_used = "public-entry"
                          else:
                              message += f"; public-entry retry failed: {retry_message}"
                      host = urlsplit(address).netloc
                      print(
                          f"  line={line_name!r} episode={episode_title!r} host={host} "
                          f"referer={referer_used} ok={ok} {message}"
                      )
                      if ok:
                          playable += 1
              except Exception as exc:
                  errors.append(f"{vod_id}: {type(exc).__name__}: {str(exc)[:160]}")

          print(f"\nDIRECT MEDIA PROBES={checked}; successful source samples={playable}")
          if playable == 0:
              raise RuntimeError("no public direct line passed the bounded media probe; " + "; ".join(errors[:5]))
          print("PASS: Duoduo catalogue candidates, detail and aggregate direct lines, and media segments were probed.")

          print("\\n=== CHICAGO FIRE LIVE SERIES RECONCILIATION ===")
          chicago_base_title = "芝加哥烈焰"

          def chicago_season_number(title):
              compact = re.sub(r"\s+", "", str(title or ""))
              match = re.fullmatch(r"芝加哥烈焰第?([0-9]{1,2}|[一二三四五六七八九十]+)季", compact)
              if not match:
                  return 0
              raw = match.group(1)
              if raw.isdigit():
                  return int(raw)
              digits = {"一": 1, "二": 2, "三": 3, "四": 4, "五": 5,
                        "六": 6, "七": 7, "八": 8, "九": 9, "十": 10}
              if raw == "十":
                  return 10
              if raw.startswith("十"):
                  return 10 + digits.get(raw[1:], 0)
              if raw.endswith("十"):
                  return digits.get(raw[0], 0) * 10
              if "十" in raw:
                  left, right = raw.split("十", 1)
                  return digits.get(left, 0) * 10 + digits.get(right, 0)
              return digits.get(raw, 0)

          assert chicago_season_number("芝加哥烈焰 第一季") == 1
          assert chicago_season_number("芝加哥烈焰第五季") == 5
          assert chicago_season_number("芝加哥烈焰 第五季") == 5
          assert chicago_season_number("芝加哥烈焰 第十二季") == 12

          chicago_catalog = {}
          chicago_conflicts = []
          for page in range(1, 4):
              _, payload = api(
                  "/api.php/web/search/index",
                  {"wd": chicago_base_title, "page": page, "limit": 24},
              )
              for row in response_rows(payload.get("data")):
                  season_number = chicago_season_number(row_title(row))
                  vod_id = row_id(row)
                  if not season_number or not vod_id.isdigit():
                      continue
                  previous = chicago_catalog.get(season_number)
                  if previous and row_id(previous) != vod_id:
                      chicago_conflicts.append((season_number, row_id(previous), vod_id))
                  else:
                      chicago_catalog[season_number] = row

          if chicago_conflicts:
              raise RuntimeError(
                  "Chicago Fire exact season search produced ambiguous IDs: "
                  + repr(chicago_conflicts)
              )
          missing_required = sorted({1, 5} - set(chicago_catalog))
          if missing_required:
              raise RuntimeError(
                  "Chicago Fire exact series search did not return required seasons "
                  + repr(missing_required)
              )

          chicago_season_results = []
          for season_number, summary in sorted(chicago_catalog.items()):
              vod_id = row_id(summary)
              search_title = row_title(summary)
              api_base, detail_payload = api(
                  "/api.php/web/vod/get_detail", {"vod_id": vod_id}
              )
              details = response_rows(detail_payload.get("data"))
              if not details:
                  raise RuntimeError(
                      f"Chicago Fire S{season_number:02d} id={vod_id}: empty official detail response"
                  )
              detail = details[0]
              detail_id = row_id(detail)
              detail_title = row_title(detail)
              if detail_id != vod_id or normalize_target_title(detail_title) != normalize_target_title(search_title):
                  raise RuntimeError(
                      f"Chicago Fire S{season_number:02d} search/detail identity mismatch: "
                      f"search=({vod_id},{search_title!r}) detail=({detail_id},{detail_title!r})"
                  )

              direct = []
              player_rows = response_rows(detail_payload.get("vodplayer"))
              player_by_from = {
                  str(player.get("from") or "").strip(): player
                  for player in player_rows if str(player.get("from") or "").strip()
              }
              names = split_source_groups(detail.get("vod_play_from"), comma_fallback=True)
              blocks = split_source_groups(detail.get("vod_play_url"))
              for index, name in enumerate(names[:len(blocks)]):
                  player = player_by_from.get(name.strip(), {})
                  if str(player.get("decode_status") or "0") != "0":
                      continue
                  for episode in blocks[index].split("#"):
                      if "$" not in episode:
                          continue
                      episode_title, address = episode.split("$", 1)
                      address = address.strip()
                      if address and urlsplit(address).path.lower().endswith((".m3u8", ".mp4")):
                          direct.append((episode_title.strip(), address, "detail"))

              _, aggregate_payload = api(
                  "/api.php/web/internal/search_aggregate", {"vod_id": vod_id}
              )
              for line in response_rows(aggregate_payload.get("data")):
                  if str(line.get("decode_status")) != "0":
                      continue
                  for episode in str(line.get("vod_play_url") or "").split("#"):
                      if "$" not in episode:
                          continue
                      episode_title, address = episode.split("$", 1)
                      address = address.strip()
                      if address and urlsplit(address).path.lower().endswith((".m3u8", ".mp4")):
                          direct.append((episode_title.strip(), address, "aggregate"))

              unique_urls = {}
              for episode_title, address, origin in direct:
                  unique_urls.setdefault(address, (episode_title, origin))
              episode_numbers = {
                  int(match.group(1))
                  for episode_title, _ in unique_urls.values()
                  if (match := re.search(r"([0-9]{1,4})", episode_title))
              }
              remarks = str(detail.get("vod_remarks") or summary.get("vod_remarks") or "")
              print(
                  f"CHICAGO_FIRE season={season_number:02d} id={vod_id} "
                  f"search_title={search_title!r} detail_title={detail_title!r} "
                  f"remarks={remarks!r} direct_urls={len(unique_urls)} "
                  f"distinct_episode_numbers={len(episode_numbers)} "
                  f"poster_fields={[key for key in ('vod_pic','vod_pic_thumb','vod_pic_detail','vod_pic_big','vod_pic_original') if detail.get(key)]}"
              )
              chicago_season_results.append({
                  "season": season_number,
                  "id": vod_id,
                  "title": detail_title,
                  "direct_urls": len(unique_urls),
                  "episodes": len(episode_numbers),
              })

          for required_season in (1, 5):
              result = next(item for item in chicago_season_results if item["season"] == required_season)
              if result["direct_urls"] == 0 or result["episodes"] == 0:
                  raise RuntimeError(
                      f"Chicago Fire S{required_season:02d} has no direct detail/aggregate episodes: {result}"
                  )
          print(
              "PASS: Chicago Fire exact search IDs match their official detail IDs; "
              "season 1 and season 5 both expose direct episode data through the shared detail+aggregate resolver."
          )

          print("\\n=== USER-REPORTED CHICAGO MED S1 PLAYBACK: 131229 ===")
          chicago_med_id = "131229"
          med_base, med_payload = api(
              "/api.php/web/vod/get_detail", {"vod_id": chicago_med_id}
          )
          med_rows = response_rows(med_payload.get("data"))
          if not med_rows:
              raise RuntimeError("Chicago Med S1 id=131229 returned no official detail row")
          med = med_rows[0]
          med_title = row_title(med)
          med_returned_id = row_id(med)
          if med_returned_id != chicago_med_id:
              raise RuntimeError(
                  f"Chicago Med requested detail identity mismatch: requested={chicago_med_id} returned={med_returned_id}"
              )
          if not any(alias in med_title for alias in ("芝加哥醫院", "芝加哥医院", "芝加哥急救", "Chicago Med")):
              raise RuntimeError(
                  f"Chicago Med id=131229 official title mismatch: {med_title!r}"
              )

          def safe_media_kind(address):
              value = str(address or "").strip()
              parsed = urlsplit(value)
              suffix = parsed.path.lower().rsplit(".", 1)[-1] if "." in parsed.path.rsplit("/", 1)[-1] else "none"
              if parsed.scheme not in ("http", "https") or not parsed.hostname:
                  return (
                      f"invalid scheme={parsed.scheme or '-'} host={parsed.hostname or '-'} "
                      f"authority={'yes' if parsed.netloc else 'no'} ext={suffix}"
                  )
              return f"{parsed.hostname}{parsed.path[-48:]} [ext={suffix}]"

          def is_direct_http_media(address):
              parsed = urlsplit(str(address or "").strip())
              return (
                  parsed.scheme.lower() in ("http", "https")
                  and bool(parsed.hostname)
                  and (
                      parsed.path.lower().endswith(".m3u8")
                      or parsed.path.lower().endswith(".mp4")
                  )
              )

          med_player_rows = response_rows(med_payload.get("vodplayer"))
          med_player_by_from = {
              str(player.get("from") or "").strip(): player
              for player in med_player_rows if str(player.get("from") or "").strip()
          }
          med_detail_lines = []
          med_direct = []
          med_non_direct = []
          med_names = split_source_groups(med.get("vod_play_from"), comma_fallback=True)
          med_blocks = split_source_groups(med.get("vod_play_url"))
          for index, name in enumerate(med_names[:len(med_blocks)]):
              player = med_player_by_from.get(name.strip(), {})
              decode_status = str(player.get("decode_status") or "0")
              entries = []
              for episode in med_blocks[index].split("#"):
                  if "$" not in episode:
                      continue
                  episode_title, address = episode.split("$", 1)
                  address = address.strip()
                  if not address:
                      continue
                  record = (episode_title.strip(), address, name)
                  entries.append(record)
                  if decode_status == "0" and is_direct_http_media(address):
                      med_direct.append(record)
                  else:
                      med_non_direct.append((decode_status, episode_title.strip(), address, name))
              med_detail_lines.append({
                  "from": name,
                  "show": str(player.get("show") or name),
                  "decode_status": decode_status,
                  "episodes": len(entries),
                  "direct_urls": sum(
                      1 for _, address, _ in entries
                      if decode_status == "0" and is_direct_http_media(address)
                  ),
                  "non_direct_samples": [
                      safe_media_kind(address)
                      for _, address, _ in entries[:2]
                      if not (decode_status == "0" and is_direct_http_media(address))
                  ],
              })

          _, med_aggregate_payload = api(
              "/api.php/web/internal/search_aggregate", {"vod_id": chicago_med_id}
          )
          med_aggregate_rows = response_rows(med_aggregate_payload.get("data"))
          med_aggregate_summary = []
          for line in med_aggregate_rows:
              decode_status = str(line.get("decode_status") or "0")
              site_key = str(line.get("site_key") or line.get("vod_play_from") or "")
              site_name = str(line.get("site_name") or site_key or "aggregate")
              line_label = f"{site_name} [{site_key}]" if site_key else site_name
              raw = str(line.get("vod_play_url") or "")
              entries = []
              for episode in raw.split("#"):
                  if "$" not in episode:
                      continue
                  episode_title, address = episode.split("$", 1)
                  address = address.strip()
                  if not address:
                      continue
                  entries.append((episode_title.strip(), address))
                  if decode_status == "0" and is_direct_http_media(address):
                      med_direct.append((episode_title.strip(), address, line_label))
                  else:
                      med_non_direct.append((decode_status, episode_title.strip(), address, line_label))
              med_aggregate_summary.append({
                  "site_key": site_key,
                  "site_name": site_name,
                  "decode_status": decode_status,
                  "episodes": len(entries),
                  "direct_urls": sum(
                      1 for _, address in entries
                      if decode_status == "0" and is_direct_http_media(address)
                  ),
                  "non_direct_samples": [
                      safe_media_kind(address)
                      for _, address in entries[:2]
                      if not (decode_status == "0" and is_direct_http_media(address))
                  ],
              })

          direct_unique = {}
          for title, address, origin in med_direct:
              direct_unique.setdefault(address, (title, origin))
          print(
              f"CHICAGO_MED id={med_returned_id} title={med_title!r} "
              f"remarks={str(med.get('vod_remarks') or '')!r} "
              f"poster_fields={[key for key in ('vod_pic','vod_pic_thumb','vod_pic_detail','vod_pic_big','vod_pic_original','vod_pic_slide') if med.get(key)]}"
          )
          print(
              f"CHICAGO_MED detail_player_rows={len(med_player_rows)} "
              f"detail_lines={med_detail_lines!r}"
          )
          print(
              f"CHICAGO_MED aggregate_lines={len(med_aggregate_rows)} "
              f"aggregate_summary={med_aggregate_summary!r}"
          )
          print(
              f"CHICAGO_MED direct_urls={len(direct_unique)} "
              f"non_direct_entries={len(med_non_direct)} "
              f"non_direct_samples={[{'decode_status': row[0], 'line': row[3], 'media': safe_media_kind(row[2])} for row in med_non_direct[:8]]!r}"
          )
          if not direct_unique:
              raise RuntimeError(
                  "Chicago Med S1 id=131229 has no D-TV-compatible direct detail/aggregate URL; "
                  "inspect the redacted decode-status and URL-kind summaries above."
              )
          # Probe one real episode URL from every official aggregate source line,
          # not three adjacent episodes from the first line only.
          probe_by_line = {}
          for episode_title, address, origin in med_direct:
              probe_by_line.setdefault(origin, (episode_title, address))
          med_probe_ok = False
          for origin, (episode_title, address) in probe_by_line.items():
              ok, message = probe_media(address, med_base + "/")
              if not ok:
                  retry_ok, retry_message = probe_media(address, "https://duoduozhuiju.com/")
                  if retry_ok:
                      ok, message = retry_ok, retry_message
                  else:
                      message += f"; public-entry retry failed: {retry_message}"
              print(
                  f"CHICAGO_MED_MEDIA episode={episode_title!r} line={origin!r} "
                  f"media={safe_media_kind(address)} ok={ok} {message}"
              )
              med_probe_ok = med_probe_ok or ok
          if not med_probe_ok:
              raise RuntimeError("Chicago Med S1 id=131229 direct media URLs did not pass the bounded public media probe")
          print("PASS: Chicago Med S1 id=131229 has validated official direct playback data.")
          PY

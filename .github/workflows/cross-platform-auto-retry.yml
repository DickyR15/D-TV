name: D TV Cross-platform Build Auto Retry

on:
  workflow_run:
    workflows:
      - D TV Cross-platform Release Build
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  retry-failed-jobs:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 && (github.event.workflow_run.event == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v') && github.event.workflow_run.head_branch != 'v1.0.3')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out retry classifier
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run view "${{ github.event.workflow_run.id }}" --repo "${{ github.repository }}" --log-failed > failed-run.log
      - name: Retry only transient infrastructure failures
        id: classify
        run: python scripts/classify_failed_run.py failed-run.log
      - name: Skip retries for superseded commits
        id: head
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const run = context.payload.workflow_run;
            const isTag = (run.event === "push" || run.event === "workflow_dispatch") && (run.head_branch || "").startsWith("v");
            const refName = (isTag ? "tags/" : "heads/") + run.head_branch;
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: refName
            });

            let target = ref.data.object;
            // Resolve annotated tags to their commit before comparing with head_sha.
            while (target.type === "tag") {
              const annotatedTag = await github.rest.git.getTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_sha: target.sha
              });
              target = annotatedTag.data.object;
            }

            const latestSha = target.sha;
            core.info("Failed build SHA: " + run.head_sha);
            core.info("Current ref SHA: " + latestSha);
            return latestSha === run.head_sha ? "current" : "superseded";
      - name: Re-run failed jobs (maximum 3 attempts)
        if: ${{ steps.classify.outputs.retry == 'true' && steps.head.outputs.result == 'current' }}
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            core.warning(
              "Transient failure in cross-platform build attempt " + run.run_attempt +
              ". Re-running failed jobs; maximum attempts: 3. Run: " + run.html_url
            );
            await github.rest.actions.reRunFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id
            });

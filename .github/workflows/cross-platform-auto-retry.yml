name: D TV Cross-platform Build Auto Retry

on:
  workflow_run:
    workflows:
      - D TV Cross-platform Release Build
    types:
      - completed
    branches:
      - feat/phase5-cross-platform-universal
      - main

permissions:
  actions: write
  contents: read

jobs:
  retry-failed-jobs:
    if: \${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs (maximum 3 attempts)
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            core.warning(
              "Cross-platform build attempt " + run.run_attempt +
              " failed. Re-running failed jobs; maximum attempts: 3. Run: " + run.html_url
            );
            await github.rest.actions.reRunFailedJobs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id
            });

name: Build D TV Android v7a
run-name: 'D TV Android v7a rebuild · ${{ github.sha }}'

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "lib/**"
      - "native/**"
      - "android/**"
      - "assets/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/build_android.py"
      - "analysis_options.yaml"

concurrency:
  group: dtv-v7a-current-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android-v7a:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - name: Test Taiwan Traditional Chinese conversion
        run: |
          flutter pub get
          flutter test test/ui_localization_test.dart test/playback_preferences_test.dart
      - name: Set up Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: dtv-release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD in GitHub repository settings before building."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dtv-release.jks"
          test -s "$RUNNER_TEMP/dtv-release.jks"
          chmod 600 "$RUNNER_TEMP/dtv-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dtv-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"
      - name: Build APK (armeabi-v7a)
        run: python scripts/build_android.py --abi armeabi-v7a
      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find dist/android -maxdepth 1 -type f -name '*armeabi-v7a.apk' | head -n1)
          test -n "$apk"
          version=$(sed -n "s/^version: *['\"]\?\([^'\"]*\)['\"]\?$/\1/p" pubspec.yaml | head -n1)
          version="${version%%+*}"
          test -n "$version"
          output="dist/android/D TV-Android-v7a_v${version}.apk"
          mv "$apk" "$output"
          echo "APK_OUTPUT=$output" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: D TV-Android-v7a
          path: ${{ env.APK_OUTPUT }}
          if-no-files-found: error
          retention-days: 14

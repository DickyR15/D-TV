name: Sync Historical Release Notes

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "將 CHANGELOG.md 的 1.0.1-1.0.6 更新項目寫入正式 Release"
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

permissions:
  contents: write

concurrency:
  group: dtv-sync-historical-release-notes
  cancel-in-progress: false

jobs:
  sync:
    if: inputs.confirm == 'yes'
    name: Sync v1.0.1-v1.0.6 release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish version-specific update notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_release_notes.py

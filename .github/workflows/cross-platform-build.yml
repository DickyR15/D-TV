name: D TV Cross-platform Release Build

on:
  push:
    branches:
      - feat/phase5-cross-platform-universal
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cross-platform-build.yml"
      - "lib/**"
      - "native/**"
      - "android/**"
      - "ios/**"
      - "macos/**"
      - "windows/**"
      - "scripts/**"
      - "assets/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

concurrency:
  group: dtv-cross-platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.4"

jobs:
  core-validation:
    name: Shared Go and Flutter validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies (retry transient network errors)
        run: python scripts/retry_command.py --attempts 3 -- flutter pub get --enforce-lockfile
      - name: Test Flutter suite
        run: flutter test
      - name: Test shared Go core
        working-directory: native
        run: python ../scripts/retry_command.py --attempts 3 -- go test ./...

  windows-x64:
    name: Windows x64 portable ZIP
    needs: core-validation
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Build and package Windows x64
        shell: pwsh
        run: python scripts/retry_command.py --attempts 3 -- python scripts/build_windows.py
      - name: Smoke launch the portable app
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build/windows/x64/runner/Release/zhenguojian.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) {
            throw "D-TV exited during its Windows portable startup smoke test (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: D-TV-Windows-x64-Portable
          path: dist/windows/*.zip
          if-no-files-found: error
          retention-days: 14

  android-universal:
    name: Android Universal APK (3 ABIs)
    needs: core-validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-36
            build-tools;36.0.0
            platform-tools
            ndk;28.2.13676358
          accept-android-sdk-licenses: true
      - name: Build one APK with ARM64, ARMv7 and x86_64
        id: build-universal
        shell: bash
        run: |
          version=$(sed -n "s/^version: *['\"]\?\([^'\"]*\)['\"]\?$/\1/p" pubspec.yaml | head -n1)
          version="${version%%+*}"
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          python scripts/retry_command.py --attempts 3 -- python scripts/build_android.py --universal --build-name "$version" --build-number "$GITHUB_RUN_NUMBER"
      - name: Install and launch Universal APK on x86_64 Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            apk="dist/android/D TV-Android-Universal_v${{ steps.build-universal.outputs.app_version }}+${{ github.run_number }}_MPV.apk"
            adb install -r "$apk"
            adb shell am start -n com.dickyr15.dtv/.MainActivity
            sleep 15
            adb shell pidof com.dickyr15.dtv
      - uses: actions/upload-artifact@v4
        with:
          name: D-TV-Android-Universal-APK
          path: dist/android/D TV-Android-Universal_v*.apk
          if-no-files-found: error
          retention-days: 14

  ios-ipa:
    name: iOS device IPA and simulator build
    needs: core-validation
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install CocoaPods
        run: gem install cocoapods --no-document
      - name: Build device IPA and universal simulator core
        run: python scripts/retry_command.py --attempts 3 -- python scripts/build_ios.py --simulator
      - name: Build iOS Simulator app
        run: flutter build ios --simulator --release --no-codesign --no-pub
      - name: Install and launch on an iPhone Simulator
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available | sed -nE 's/.*(iPhone[^()]*) \(([A-F0-9-]{36})\).*/\2/p' | head -n1)
          test -n "$device_id"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          app="build/ios/iphonesimulator/Runner.app"
          test -d "$app"
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist")
          xcrun simctl install "$device_id" "$app"
          xcrun simctl launch "$device_id" "$bundle_id"
      - uses: actions/upload-artifact@v4
        with:
          name: D-TV-iOS-Unsigned-IPA
          path: dist/ios/*.ipa
          if-no-files-found: error
          retention-days: 14

  macos-universal:
    name: macOS Universal DMG (arm64 + x86_64)
    needs: core-validation
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install CocoaPods
        run: gem install cocoapods --no-document
      - name: Build universal Go core, Flutter app and DMG
        run: python scripts/retry_command.py --attempts 3 -- python scripts/build_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: D-TV-macOS-Universal-DMG
          path: dist/macos/*.dmg
          if-no-files-found: error
          retention-days: 14

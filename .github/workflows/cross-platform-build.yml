name: D TV Cross-platform Release Build
# Rebuild latest cross-platform branch head after Taiwan terminology updates.

on:
  push:
    branches:
      - feat/phase5-cross-platform-universal
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cross-platform-build.yml"
      - ".github/workflows/duoduo-entry-probe.yml"
      - "lib/**"
      - "native/**"
      - "android/**"
      - "ios/**"
      - "macos/**"
      - "windows/**"
      - "scripts/**"
      - "assets/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:
    inputs:
      platform:
        description: "選擇要建置的平台"
        required: true
        type: choice
        default: all
        options:
          - all
          - ios
          - android
          - windows
          - macos

concurrency:
  group: dtv-cross-platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  core-validation:
    name: Shared Go and Flutter validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies (retry transient network errors)
        run: python scripts/retry_command.py --attempts 3 -- flutter pub get
      - name: Test Flutter suite
        run: flutter test --dart-define=ALL_SOURCES=true
      - name: Test standard edition primary sources
        run: >-
          flutter test --dart-define=ALL_SOURCES=false
          test/source_switches_test.dart
          test/app_build_test.dart
          test/source_management_screen_test.dart
      - name: Test shared Go core
        working-directory: native
        run: python ../scripts/retry_command.py --attempts 3 -- go test ./...

  windows-x64:
    if: (github.event_name == 'pull_request') || (github.event_name == 'push' && github.ref == 'refs/heads/feat/phase5-cross-platform-universal') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'windows'))
    name: Windows x64 Portable ZIP
    needs: core-validation
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for platform icons
        run: python -m pip install --disable-pip-version-check "Pillow>=10.4,<13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Download and verify FFmpegKit Windows x64 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assetUrl = "https://github.com/sk3llo/ffmpeg_kit_flutter/releases/download/8.1.2-min-gpl/ffmpeg-kit-windows-x86_64-min-gpl-8.1.2.zip"
          $expectedSha256 = "c3a69388f32ff86e4622baada470d2acc55d577a51b6ec15b68560c1f1b6e37b"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-kit-windows-x86_64-min-gpl-8.1.2.zip"
          $bundleDir = Join-Path $env:RUNNER_TEMP "ffmpeg-kit-windows-x86_64-min-gpl-8.1.2"

          # Download the official pinned release asset outside CMake. CMake's
          # file(DOWNLOAD) gets an HTTP error on the Windows hosted runner;
          # curl follows GitHub's release-asset redirect reliably.
          & curl.exe --fail --location --show-error --silent --retry 3 --retry-all-errors --retry-delay 3 --output $archive $assetUrl
          if ($LASTEXITCODE -ne 0) {
            throw "無法下載 FFmpegKit Windows x64 官方套件（curl exit $LASTEXITCODE）。"
          }

          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "FFmpegKit SHA-256 不符：$actualSha256"
          }

          if (Test-Path -LiteralPath $bundleDir) {
            Remove-Item -LiteralPath $bundleDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $bundleDir -Force

          $requiredDll = Join-Path $bundleDir "bin/libffmpegkit.dll"
          if (-not (Test-Path -LiteralPath $requiredDll)) {
            Get-ChildItem -LiteralPath $bundleDir -Recurse | Select-Object -First 40 FullName
            throw "FFmpegKit 官方套件缺少 bin/libffmpegkit.dll。"
          }

          "FFMPEGKIT_LOCAL_DIR=$bundleDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFmpegKit verified: $actualSha256"
          Get-ChildItem -LiteralPath (Join-Path $bundleDir "bin") -Filter "*.dll" | Select-Object Name, Length
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Read Windows package version
        id: windows-version
        shell: pwsh
        run: |
          $line = (Select-String -Path "pubspec.yaml" -Pattern "^version:").Line
          $version = $line -replace "^version:\s*", ""
          $version = $version.Trim().Trim('"').Trim("'").Split('+')[0]
          if (-not $version) { throw "無法讀取 D TV 版本號。" }
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVersion -ne $version) {
              throw "版本標籤 v$tagVersion 與 pubspec.yaml 版本 $version 不一致。"
            }
          }
          "app_version=$version" >> $env:GITHUB_OUTPUT
          "D TV release version: $version"
      - name: Build and package Windows x64
        shell: pwsh
        run: python scripts/retry_command.py --attempts 3 -- python scripts/build_windows.py --all-sources
      - name: Smoke launch the portable app
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build/windows/x64/runner/Release/DTV.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) {
            throw "D TV exited during its Windows portable startup smoke test (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force
      # Upload the unpacked portable bundle as the artifact itself. GitHub
      # creates the downloadable ZIP, so uploading dist/*.zip here would
      # produce a ZIP containing another ZIP (two extraction steps).
      - uses: actions/upload-artifact@v4
        with:
          name: DTV-${{ steps.windows-version.outputs.app_version }}-Windows-Portable
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
  android-universal:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/feat/phase5-cross-platform-universal') || (github.event_name == 'pull_request') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'android'))
    name: Android Universal APK (3 ABIs)
    needs: core-validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free unused runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo apt-get clean
          df -h
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for platform icons
        run: python -m pip install --disable-pip-version-check "Pillow>=10.4,<13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Cache Gradle dependencies and reusable task outputs between branch builds.
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools ndk;28.2.13676358"
          accept-android-sdk-licenses: true
      - name: Set up Android signing (same key source as v7a build)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: dtv-release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Configure the original v7a signing secrets before publishing a Universal APK. A debug-signed APK cannot update a previously installed release."
              exit 1
            fi
            echo "::warning::Release signing secrets are not configured; this branch test APK will use the Gradle debug signing fallback and cannot update a previously installed v7a release."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dtv-release.jks"
          test -s "$RUNNER_TEMP/dtv-release.jks"
          chmod 600 "$RUNNER_TEMP/dtv-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dtv-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build one APK with ARM64, ARMv7 and x86_64
        id: build-universal
        shell: bash
        run: |
          full_version=$(sed -n "s/^version: *['\"]\?\([^'\"]*\)['\"]\?$/\1/p" pubspec.yaml | head -n1)
          version="${full_version%%+*}"
          pubspec_build_number="${full_version##*+}"
          if [[ "$full_version" != *"+"* || ! "$pubspec_build_number" =~ ^[0-9]+$ ]]; then
            echo "pubspec.yaml must include a numeric Android build number (version+build)." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_version="${GITHUB_REF_NAME#v}"
            if [[ "$release_version" != "$version" ]]; then
              echo "版本標籤 $GITHUB_REF_NAME 與 pubspec.yaml 版本 $version 不一致。" >&2
              exit 1
            fi
          fi
          build_number=$((pubspec_build_number + GITHUB_RUN_NUMBER - 1))
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "app_version_code=$build_number" >> "$GITHUB_OUTPUT"
          python scripts/retry_command.py --attempts 3 -- python scripts/build_android.py --universal --all-sources --build-name "$version" --build-number "$build_number"
      - name: Verify Android Universal APK signature, package and ABIs
        shell: bash
        run: |
          set -euo pipefail
          apk="dist/android/DTV-${{ steps.build-universal.outputs.app_version }}-Android.apk"
          test -s "$apk"
          echo "驗證 APK 簽署憑證："
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          echo "驗證 Android 套件識別："
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.dickyr15.dtv'"
          echo "驗證 Universal APK 的三種 ABI："
          entries="$(unzip -Z1 "$apk")"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if ! grep -q "^lib/$abi/" <<< "$entries"; then
              echo "::error::Universal APK 缺少 $abi 原生程式庫。"
              exit 1
            fi
            echo "  - $abi OK"
          done
      # Emulator startup is best-effort on GitHub's Linux runners: this runner
      # has no KVM access and x86_64 cold boots can remain ADB-offline. APK
      # integrity/signature/package/ABI checks above remain required.
      - name: Best-effort install and launch on x86_64 Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        timeout-minutes: 15
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r "dist/android/DTV-${{ steps.build-universal.outputs.app_version }}-Android.apk"
            adb shell am start -n com.dickyr15.dtv/.MainActivity
            sleep 15
            adb shell pidof com.dickyr15.dtv
      - uses: actions/upload-artifact@v4
        with:
          name: DTV-Android-APK
          path: dist/android/DTV-*.apk
          if-no-files-found: error
          retention-days: 14
  ios-ipa:
    if: (github.event_name == 'pull_request') || (github.event_name == 'push' && github.ref == 'refs/heads/feat/phase5-cross-platform-universal') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'ios'))
    name: iOS device IPA and simulator build
    needs: core-validation
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for platform icons
        run: python -m pip install --disable-pip-version-check "Pillow>=10.4,<13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install CocoaPods
        run: gem install cocoapods --no-document
      - name: Build device IPA and universal simulator core
        run: python scripts/retry_command.py --attempts 3 -- python scripts/build_ios.py --simulator --all-sources
      - name: Build iOS Simulator app
        # Flutter only supports Debug/Profile simulator builds; Release is
        # reserved for physical iOS devices.
        run: flutter build ios --simulator --debug --no-codesign --no-pub --dart-define=ALL_SOURCES=true
      - name: Install and launch on an iPhone Simulator
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available | sed -nE 's/.*(iPhone[^()]*) \(([A-F0-9-]{36})\).*/\2/p' | head -n1)
          test -n "$device_id"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          app="build/ios/iphonesimulator/Runner.app"
          test -d "$app"
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist")
          xcrun simctl install "$device_id" "$app"
          xcrun simctl launch "$device_id" "$bundle_id"
      - uses: actions/upload-artifact@v4
        with:
          name: DTV-iOS-IPA
          path: dist/ios/DTV-*.ipa
          if-no-files-found: error
          retention-days: 14
  macos-universal:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/feat/phase5-cross-platform-universal') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'macos'))
    name: macOS Universal DMG (arm64 + x86_64)
    needs: core-validation
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for platform icons
        run: python -m pip install --disable-pip-version-check "Pillow>=10.4,<13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install CocoaPods
        run: gem install cocoapods --no-document
      - name: Build universal Go core, Flutter app and DMG
        run: python scripts/retry_command.py --attempts 3 -- python scripts/build_macos.py --all-sources
      - uses: actions/upload-artifact@v4
        with:
          name: DTV-macOS-DMG
          path: dist/macos/DTV-*.dmg
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Prepare verified Draft Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - core-validation
      - windows-x64
      - android-universal
      - ios-ipa
      - macos-universal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download platform build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Assemble and verify release files
        id: release-files
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if [[ "$tag" != v* || -z "$version" ]]; then
            echo "只接受 v 開頭的正式版本標籤，例如 v1.0.2。" >&2
            exit 1
          fi

          windows_dir="release-artifacts/DTV-${version}-Windows-Portable"
          android_apk="release-artifacts/DTV-Android-APK/DTV-${version}-Android.apk"
          macos_dmg="release-artifacts/DTV-macOS-DMG/DTV-${version}-macOS.dmg"
          ios_ipa="release-artifacts/DTV-iOS-IPA/DTV-${version}-iOS.ipa"

          test -d "$windows_dir"
          for package in "$android_apk" "$macos_dmg" "$ios_ipa"; do
            if [[ ! -s "$package" ]]; then
              echo "缺少正式發布檔案或檔案為空：$package" >&2
              exit 1
            fi
          done

          mkdir -p release-files
          (
            cd "$windows_dir"
            zip -qr "$GITHUB_WORKSPACE/release-files/DTV-${version}-Windows-Portable.zip" .
          )
          cp "$android_apk" "$macos_dmg" "$ios_ipa" release-files/

          # Generate SHA-256 checksums for every distributable platform package.
          (
            cd release-files
            sha256sum \
              "DTV-${version}-Android.apk" \
              "DTV-${version}-Windows-Portable.zip" \
              "DTV-${version}-macOS.dmg" \
              "DTV-${version}-iOS.ipa" \
              > SHA256SUMS.txt
          )

          for package in release-files/*; do
            if [[ ! -s "$package" ]]; then
              echo "正式發布檔案為空：$package" >&2
              exit 1
            fi
            ls -lh "$package"
          done
          test "$(find release-files -maxdepth 1 -type f | wc -l)" -eq 5
          checksums="$(cat release-files/SHA256SUMS.txt)"
          delimiter="DTV_SHA256_$(date +%s)"
          {
            echo "checksums<<$delimiter"
            printf '%s\n' "$checksums"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release after successful builds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: D TV ${{ steps.release-files.outputs.version }} 正式版
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            ## D TV ${{ steps.release-files.outputs.version }} 正式版

            四個平台的正式建置與必要檢查已全部通過；Windows 提供免安裝 ZIP。

            ### 下載檔案
            - Android／Android TV：Universal APK（ARM64、ARMv7、x86_64）
            - Windows x64：免安裝 ZIP（解壓後即可執行）
            - macOS：Apple Silicon／Intel Universal DMG
            - iOS：未簽章 IPA，需自行簽署後側載安裝

            ### SHA-256 檔案完整性驗證

            以下為正式發布附件的 SHA-256 校驗碼。下載後可使用 SHA256SUMS.txt 進行比對。

            ```text
            ${{ steps.release-files.outputs.checksums }}
            ```

            請確認附件、校驗碼與版本資訊後，再手動發布此 Draft Release。
          files: |
            release-files/DTV-${{ steps.release-files.outputs.version }}-Android.apk
            release-files/DTV-${{ steps.release-files.outputs.version }}-Windows-Portable.zip
            release-files/DTV-${{ steps.release-files.outputs.version }}-macOS.dmg
            release-files/DTV-${{ steps.release-files.outputs.version }}-iOS.ipa
            release-files/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# validation-retrigger-1

name: D TV Cross-platform Release Build
# Rebuild latest cross-platform branch head after Taiwan terminology updates.

on:
  push:
    branches:
      - feat/phase5-cross-platform-universal
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cross-platform-build.yml"
      - "lib/**"
      - "native/**"
      - "android/**"
      - "ios/**"
      - "macos/**"
      - "windows/**"
      - "scripts/**"
      - "assets/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

concurrency:
  group: dtv-cross-platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.4"

jobs:
  core-validation:
    name: Shared Go and Flutter validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies (retry transient network errors)
        run: python scripts/retry_command.py --attempts 3 -- flutter pub get
      - name: Test Flutter suite
        run: flutter test --dart-define=ALL_SOURCES=true
      - name: Test shared Go core
        working-directory: native
        run: python ../scripts/retry_command.py --attempts 3 -- go test ./...

  windows-x64:
    name: Windows x64 portable ZIP
    needs: core-validation
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for platform icons
        run: python -m pip install --disable-pip-version-check "Pillow>=10.4,<13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Read Windows package version
        id: windows-version
        shell: pwsh
        run: |
          $line = (Select-String -Path "pubspec.yaml" -Pattern "^version:").Line
          $version = $line -replace "^version:\s*", ""
          $version = $version.Trim().Trim('"').Trim("'").Split('+')[0]
          if (-not $version) { throw "無法讀取 D TV 版本號。" }
          "app_version=$version" >> $env:GITHUB_OUTPUT
      - name: Build and package Windows x64
        shell: pwsh
        run: python scripts/retry_command.py --attempts 3 -- python scripts/build_windows.py --all-sources
      - name: Smoke launch the portable app
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build/windows/x64/runner/Release/DTV.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) {
            throw "D TV exited during its Windows portable startup smoke test (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force
      # Upload the unpacked portable bundle as the artifact itself. GitHub
      # creates the downloadable ZIP, so uploading dist/*.zip here would
      # produce a ZIP containing another ZIP (two extraction steps).
      - uses: actions/upload-artifact@v4
        with:
          name: DTV-${{ steps.windows-version.outputs.app_version }}-Windows-Portable
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  android-universal:
    name: Android Universal APK (3 ABIs)
    needs: core-validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free unused runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo apt-get clean
          df -h
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for platform icons
        run: python -m pip install --disable-pip-version-check "Pillow>=10.4,<13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Cache Gradle dependencies and reusable task outputs between branch builds.
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools ndk;28.2.13676358"
          accept-android-sdk-licenses: true
      - name: Set up Android signing (same key source as v7a build)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: dtv-release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Release signing secrets are not configured; the Universal APK will use the Gradle debug signing fallback and may not update an existing v7a installation."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dtv-release.jks"
          test -s "$RUNNER_TEMP/dtv-release.jks"
          chmod 600 "$RUNNER_TEMP/dtv-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dtv-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build one APK with ARM64, ARMv7 and x86_64
        id: build-universal
        shell: bash
        run: |
          full_version=$(sed -n "s/^version: *['\"]\?\([^'\"]*\)['\"]\?$/\1/p" pubspec.yaml | head -n1)
          version="${full_version%%+*}"
          pubspec_build_number="${full_version##*+}"
          if [[ "$full_version" != *"+"* || ! "$pubspec_build_number" =~ ^[0-9]+$ ]]; then
            echo "pubspec.yaml must include a numeric Android build number (version+build)." >&2
            exit 1
          fi
          build_number=$((pubspec_build_number + GITHUB_RUN_NUMBER - 1))
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "app_version_code=$build_number" >> "$GITHUB_OUTPUT"
          python scripts/retry_command.py --attempts 3 -- python scripts/build_android.py --universal --all-sources --build-name "$version" --build-number "$build_number"
      - name: Install and launch Universal APK on x86_64 Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r "dist/android/DTV-${{ steps.build-universal.outputs.app_version }}-Android.apk"
            adb shell am start -n com.dickyr15.dtv/.MainActivity
            sleep 15
            adb shell pidof com.dickyr15.dtv
      - uses: actions/upload-artifact@v4
        with:
          name: DTV-Android-APK
          path: dist/android/DTV-*.apk
          if-no-files-found: error
          retention-days: 14

  ios-ipa:
    name: iOS device IPA and simulator build
    needs: core-validation
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for platform icons
        run: python -m pip install --disable-pip-version-check "Pillow>=10.4,<13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install CocoaPods
        run: gem install cocoapods --no-document
      - name: Build device IPA and universal simulator core
        run: python scripts/retry_command.py --attempts 3 -- python scripts/build_ios.py --simulator --all-sources
      - name: Build iOS Simulator app
        # Flutter only supports Debug/Profile simulator builds; Release is
        # reserved for physical iOS devices.
        run: flutter build ios --simulator --debug --no-codesign --no-pub --dart-define=ALL_SOURCES=true
      - name: Install and launch on an iPhone Simulator
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available | sed -nE 's/.*(iPhone[^()]*) \(([A-F0-9-]{36})\).*/\2/p' | head -n1)
          test -n "$device_id"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          app="build/ios/iphonesimulator/Runner.app"
          test -d "$app"
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist")
          xcrun simctl install "$device_id" "$app"
          xcrun simctl launch "$device_id" "$bundle_id"
      - uses: actions/upload-artifact@v4
        with:
          name: DTV-iOS-IPA
          path: dist/ios/DTV-*.ipa
          if-no-files-found: error
          retention-days: 14

  macos-universal:
    name: macOS Universal DMG (arm64 + x86_64)
    needs: core-validation
    runs-on: macos-26
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for platform icons
        run: python -m pip install --disable-pip-version-check "Pillow>=10.4,<13"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install CocoaPods
        run: gem install cocoapods --no-document
      - name: Build universal Go core, Flutter app and DMG
        run: python scripts/retry_command.py --attempts 3 -- python scripts/build_macos.py --all-sources
      - uses: actions/upload-artifact@v4
        with:
          name: DTV-macOS-DMG
          path: dist/macos/DTV-*.dmg
          if-no-files-found: error
          retention-days: 14



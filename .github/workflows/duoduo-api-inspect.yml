name: Duoduo API inspection

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/duoduo-api-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect public entry page, frontend routes, and anonymous API responses
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.error import HTTPError, URLError
          from urllib.parse import urljoin, urlsplit
          from urllib.request import Request, urlopen
          import json
          import re
          import ssl
          from pathlib import Path

          HOSTS = [
              "duoduozhuiju.com",
              "323433ssdfd.top",
              "duoduosdf12223234334.top",
              "xds2435u23422342342u.top",
              "dduotv01.top",
          ]
          SAFE_ROUTES = [
              "/api.php/web/index/home",
              "/api.php/web/feature",
              "/api.php/web/ranking/list",
              "/api.php/web/filter/vod",
              "/api.php/web/search/index",
              "/api.php/web/search/suggest",
              "/api.php/web/internal/search_aggregate",
              "/api.php/web/external_search/search",
              "/api.php/web/vod/get_detail",
          ]
          CTX = ssl.create_default_context()
          UA = "DTV-Duoduo-ReadOnly-Inspector/1.0"
          assets = {}
          pages = []

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = []
                  self.scripts = []
                  self.links = []
                  self.in_title = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag.lower() == "title":
                      self.in_title = True
                  if tag.lower() == "script" and attrs.get("src"):
                      self.scripts.append(attrs["src"])
                  if tag.lower() == "a" and attrs.get("href"):
                      self.links.append(attrs["href"])
              def handle_endtag(self, tag):
                  if tag.lower() == "title":
                      self.in_title = False
              def handle_data(self, data):
                  if self.in_title:
                      self.title.append(data.strip())

          def request(url, timeout=12, limit=2 * 1024 * 1024, api=False):
              headers = {
                  "User-Agent": UA,
                  "Accept": "text/html,application/javascript,application/json,*/*",
              }
              if api:
                  headers.update({
                      "Accept": "application/json",
                      "X-Client": "8f3d2a1c7b6e5d4c9a0b1f2e3d4c5b6a",
                      "web-sign": "ddtvf65f3a83d6d9ad6f",
                      "Origin": "https://323433ssdfd.top",
                      "Referer": "https://323433ssdfd.top/",
                  })
              req = Request(url, headers=headers)
              try:
                  response = urlopen(req, timeout=timeout, context=CTX)
              except HTTPError as exc:
                  response = exc
              with response:
                  return response.status, response.geturl(), response.headers.get("Content-Type", ""), response.read(limit)

          for host in HOSTS:
              base = f"https://{host}/"
              try:
                  status, final, ctype, body = request(base)
                  parser = Parser()
                  parser.feed(body.decode("utf-8", errors="replace"))
                  title = " ".join(" ".join(parser.title).split())
                  scripts = [urljoin(final, src) for src in parser.scripts]
                  asset_url = next((url for url in scripts if "assets/index-" in url), "")
                  row = {
                      "host": host, "status": status, "final_url": final,
                      "title": title, "content_type": ctype,
                      "asset_url": asset_url,
                      "links": [urljoin(final, x) for x in parser.links[:30]],
                  }
                  pages.append(row)
                  print(f"PAGE {host}: HTTP={status} FINAL={final} TITLE={title!r} ASSET={asset_url or '-'}")
                  if asset_url:
                      astatus, afinal, atype, abody = request(asset_url)
                      key = re.sub(r"[^A-Za-z0-9_.-]", "_", host)
                      Path(f"duoduo-{key}.js").write_bytes(abody)
                      source = abody.decode("utf-8", errors="replace")
                      routes = sorted(set(re.findall(r"""["'](/api\\.php/web/[A-Za-z0-9_/-]+)["']""", source)))
                      print(f"  ASSET HTTP={astatus} TYPE={atype} BYTES={len(abody)} FINAL={afinal}")
                      print("  ROUTES=" + ", ".join(routes))
                      for term in ["LOGIN_USERNAME_EMPTY", "username", "Authorization", "token", "localStorage", "sessionStorage", "login"]:
                          print(f"  TERM {term!r} COUNT={source.lower().count(term.lower())}")
                      assets[host] = {"path": f"duoduo-{key}.js", "sha256_bytes": len(abody)}
              except Exception as exc:
                  print(f"PAGE {host}: ERROR={type(exc).__name__}: {str(exc)[:160]}")

          print("\n=== ANONYMOUS READ-ONLY API TESTS ===")
          for host in HOSTS[1:]:
              print(f"API HOST {host}")
              for route in SAFE_ROUTES:
                  try:
                      status, final, ctype, body = request(f"https://{host}{route}", timeout=8, limit=4096, api=True)
                      try:
                          payload = json.loads(body.decode("utf-8", errors="replace"))
                      except Exception:
                          payload = {}
                      message = str(payload.get("msg", payload.get("message", "")))[:100]
                      code = payload.get("code", payload.get("error_code", "-"))
                      print(f"  {route}: HTTP={status} CODE={code} MSG={message!r} TYPE={ctype}")
                  except Exception as exc:
                      print(f"  {route}: ERROR={type(exc).__name__}: {str(exc)[:120]}")

          Path("duoduo-page-report.json").write_text(
              json.dumps({"pages": pages, "assets": assets}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY
      - name: Upload public frontend inspection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duoduo-public-inspection
          path: |
            duoduo-*.js
            duoduo-page-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Probe public home, movie search, detail and media formats
        shell: bash
        run: |
          python - <<'PY'
          from urllib.error import HTTPError
          from urllib.parse import urlencode, urlsplit
          from urllib.request import Request, urlopen
          import json
          import re
          from pathlib import Path

          HOST = "323433ssdfd.top"
          BASE = f"https://{HOST}"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 DTV-Duoduo-ReadOnly-Probe/1.0",
              "Accept": "application/json",
              "X-Client": "8f3d2a1c7b6e5d4c9a0b1f2e3d4c5b6a",
              "web-sign": "ddtvf65f3a83d6d9ad6f",
              "Origin": f"https://{HOST}",
              "Referer": f"https://{HOST}/",
          }

          def get_json(route, params=None):
              url = BASE + route
              if params:
                  url += "?" + urlencode(params)
              req = Request(url, headers=HEADERS)
              try:
                  response = urlopen(req, timeout=15)
              except HTTPError as exc:
                  response = exc
              with response:
                  body = response.read(2 * 1024 * 1024)
                  try:
                      payload = json.loads(body.decode("utf-8", errors="replace"))
                  except Exception:
                      payload = {}
                  return response.status, payload

          def summarize_play_groups(row):
              names = str(row.get("vod_play_from", "")).split("$$$")
              blocks = str(row.get("vod_play_url", "")).split("$$$")
              for i, name in enumerate(names[:len(blocks)]):
                  episodes = [x for x in blocks[i].split("#") if "$" in x]
                  first = episodes[0].split("$", 1)[1] if episodes else ""
                  parsed = urlsplit(first)
                  print(f"  LINE name={name[:50]!r} episodes={len(episodes)} first={parsed.scheme}://{parsed.netloc}{parsed.path[:100]}")
              for item in row.get("vodplayer", []) if isinstance(row.get("vodplayer"), list) else []:
                  print("  PLAYER_CONFIG=" + json.dumps(item, ensure_ascii=False)[:500])

          print("=== HOME ===")
          status, home = get_json("/api.php/web/index/home")
          print(f"HTTP={status} CODE={home.get('code')} MSG={home.get('msg')!r}")
          data = home.get("data")
          if isinstance(data, dict):
              print("DATA_KEYS=" + ",".join(data.keys()))
              for key, value in data.items():
                  if isinstance(value, list):
                      print(f"  {key}: count={len(value)} sample=" + json.dumps(value[:2], ensure_ascii=False)[:900])
          elif isinstance(data, list):
              print(f"DATA_LIST={len(data)} sample=" + json.dumps(data[:2], ensure_ascii=False)[:900])

          print("\n=== RANKINGS ===")
          status, ranking = get_json("/api.php/web/ranking/list")
          ranking_data = ranking.get("data")
          rankings = ranking_data.get("rankings", []) if isinstance(ranking_data, dict) else []
          print(f"HTTP={status} CODE={ranking.get('code')} rankings={len(rankings)}")
          for item in rankings[:8]:
              print("  " + json.dumps(item, ensure_ascii=False)[:500])

          print("\n=== SEARCHES ===")
          queries = ["流浪地球", "阿凡達", "復仇者聯盟"]
          chosen = None
          for query in queries:
              status, result = get_json("/api.php/web/search/index", {"wd": query, "page": 1, "limit": 10})
              rows = result.get("data") if isinstance(result.get("data"), list) else []
              print(f"QUERY={query!r} HTTP={status} CODE={result.get('code')} COUNT={len(rows)} MSG={result.get('msg')!r}")
              for row in rows[:3]:
                  print("  " + json.dumps({k: row.get(k) for k in ["vod_id","vod_name","type_name","vod_year","vod_remarks","vod_pic"]}, ensure_ascii=False)[:700])
              if rows and chosen is None:
                  chosen = (query, rows[0])

          if chosen:
              query, sample = chosen
              vod_id = str(sample.get("vod_id", "")).strip()
              print(f"\n=== DETAIL {query!r} ID={vod_id!r} ===")
              status, detail = get_json("/api.php/web/vod/get_detail", {"vod_id": vod_id})
              rows = detail.get("data") if isinstance(detail.get("data"), list) else []
              print(f"HTTP={status} CODE={detail.get('code')} MSG={detail.get('msg')!r} ROWS={len(rows)}")
              if rows:
                  row = rows[0]
                  print("METADATA=" + json.dumps({k: row.get(k) for k in ["vod_id","vod_name","type_name","vod_year","vod_remarks","vod_play_from"]}, ensure_ascii=False)[:1500])
                  summarize_play_groups({**row, "vodplayer": detail.get("vodplayer")})
                  for source in str(row.get("vod_play_url","")).split("$$$")[:3]:
                      first = next((e for e in source.split("#") if "$" in e), "")
                      if first:
                          address = first.split("$",1)[1]
                          parsed = urlsplit(address)
                          print(f"  RAW_FIRST_EP={parsed.scheme}://{parsed.netloc}{parsed.path} DIRECT_SUFFIX={parsed.path.lower().endswith(('.m3u8','.mp4'))}")

          print("\n=== INTERNAL SEARCH AGGREGATE ===")
          status, aggregate = get_json("/api.php/web/internal/search_aggregate", {"name": "流浪地球"})
          items = aggregate.get("data") if isinstance(aggregate.get("data"), list) else []
          print(f"HTTP={status} CODE={aggregate.get('code')} MSG={aggregate.get('msg')!r} SOURCES={len(items)}")
          for item in items[:8]:
              print("  " + json.dumps({k:item.get(k) for k in ["site_key","site_name","vod_play_from","decode_status","vod_play_url"]}, ensure_ascii=False)[:1200])

          print("\n=== WASM DECODER FILE ===")
          req = Request(BASE + "/assets/web_app_wasm_bg-Bxwbrgev.wasm", headers={"User-Agent": HEADERS["User-Agent"]})
          try:
              with urlopen(req, timeout=15) as response:
                  blob = response.read(8 * 1024 * 1024)
                  Path("web_app_wasm_bg.wasm").write_bytes(blob)
                  print(f"HTTP={response.status} BYTES={len(blob)} TYPE={response.headers.get('Content-Type')}")
          except Exception as exc:
              print(f"WASM_ERROR={type(exc).__name__}: {str(exc)[:160]}")
          PY
      - name: Upload decoder WASM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duoduo-decoder-wasm
          path: web_app_wasm_bg.wasm
          if-no-files-found: warn
          retention-days: 7

      - name: Validate aggregated direct playback lines and first media segments
        shell: bash
        run: |
          python - <<'PY'
          from urllib.error import HTTPError
          from urllib.parse import urlencode, urljoin, urlsplit
          from urllib.request import Request, urlopen
          import json
          import re

          HOST = "323433ssdfd.top"
          BASE = f"https://{HOST}"
          HEADERS = {
              "User-Agent": "Mozilla/5.0 DTV-Duoduo-Playback-Probe/1.0",
              "Accept": "application/json",
              "X-Client": "8f3d2a1c7b6e5d4c9a0b1f2e3d4c5b6a",
              "web-sign": "ddtvf65f3a83d6d9ad6f",
              "Origin": BASE,
              "Referer": BASE + "/",
          }

          def get(url, headers=None, limit=512 * 1024):
              req = Request(url, headers={**HEADERS, **(headers or {})})
              try:
                  response = urlopen(req, timeout=15)
              except HTTPError as exc:
                  response = exc
              with response:
                  return response.status, response.headers.get("Content-Type", ""), response.geturl(), response.read(limit)

          def api(route, params):
              status, _, _, body = get(BASE + route + "?" + urlencode(params), limit=2 * 1024 * 1024)
              try:
                  return status, json.loads(body.decode("utf-8", errors="replace"))
              except Exception:
                  return status, {}

          def check_media(address):
              status, ctype, final, body = get(address, {"Range":"bytes=0-262143", "Referer":BASE+"/"})
              text = body.decode("utf-8-sig", errors="replace")
              if status not in (200, 206) or "text/html" in ctype.lower():
                  return False, f"HTTP={status} TYPE={ctype} BYTES={len(body)}"
              if text.lstrip().startswith("#EXTM3U"):
                  child = next((x.strip() for x in text.splitlines() if x.strip() and not x.strip().startswith("#")), "")
                  if not child:
                      return False, "M3U8 has no media URI"
                  child_url = urljoin(final, child)
                  s2, t2, _, b2 = get(child_url, {"Range":"bytes=0-1023", "Referer":BASE+"/"}, limit=1024)
                  ok = s2 in (200,206) and bool(b2) and "text/html" not in t2.lower()
                  return ok, f"M3U8 HTTP={status}; first segment HTTP={s2} TYPE={t2} BYTES={len(b2)}"
              return True, f"HTTP={status} TYPE={ctype} BYTES={len(body)}"

          queries = ["流浪地球", "庆余年", "甄嬛传"]
          checked = 0
          for query in queries:
              status, search = api("/api.php/web/search/index", {"wd":query, "page":1, "limit":10})
              rows = search.get("data") if isinstance(search.get("data"), list) else []
              print(f"SEARCH {query!r}: HTTP={status} CODE={search.get('code')} RESULTS={len(rows)}")
              selected = next((x for x in rows if str(x.get("vod_id","")).isdigit()), None)
              if not selected:
                  continue
              vod_id = str(selected["vod_id"])
              print(f"  ITEM id={vod_id} name={selected.get('vod_name')!r} type={selected.get('type_name')!r} year={selected.get('vod_year')!r}")
              status, aggregate = api("/api.php/web/internal/search_aggregate", {"vod_id":vod_id})
              items = aggregate.get("data") if isinstance(aggregate.get("data"), list) else []
              print(f"  AGGREGATE HTTP={status} CODE={aggregate.get('code')} LINES={len(items)} MSG={aggregate.get('msg')!r}")
              for item in items:
                  name = str(item.get("site_name") or item.get("site_key") or "")
                  decode = str(item.get("decode_status",""))
                  raw = str(item.get("vod_play_url",""))
                  episodes = []
                  for group in raw.split("$$$"):
                      for ep in group.split("#"):
                          if "$" in ep:
                              episodes.append(ep.split("$",1)[1].strip())
                  direct = [u for u in episodes if urlsplit(u).scheme in ("http","https") and urlsplit(u).path.lower().endswith((".m3u8",".mp4"))]
                  print(f"    LINE {name[:32]!r} decode={decode} episodes={len(episodes)} direct={len(direct)}")
                  for address in direct[:1]:
                      parsed=urlsplit(address)
                      if checked >= 7: break
                      ok, message=check_media(address)
                      checked += 1
                      print(f"      MEDIA {parsed.netloc}{parsed.path[:90]} ok={ok} {message}")
                  if checked >= 7: break
              if checked >= 7: break
          print(f"TOTAL_DIRECT_MEDIA_PROBES={checked}")
          PY

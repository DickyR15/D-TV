name: Validate D-TV Redfruit Cell Pagination
run-name: "D-TV validation · ${{ github.event.head_commit.message || 'Validation build' }}"

on:
  push:
    branches:
      - fix/hongguo-recommendation-cell-pagination
    paths:
      - ".github/workflows/validate-hongguo-cell.yml"
      - "native/**"
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "scripts/build_android.py"
      - "scripts/prepare_tv_banner.py"
      - "analysis_options.yaml"

concurrency:
  group: dtv-v7a-current-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android-v7a:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36"
          accept-android-sdk-licenses: true
      - name: Test Flutter suite
        run: |
          flutter pub get
          flutter test
      - name: Test native core
        working-directory: native
        run: go test ./...
      - name: Set up Android signing (optional)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: dtv-release
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Release signing secrets are not configured; building with the Gradle debug signing fallback. For stable in-place updates, configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dtv-release.jks"
          test -s "$RUNNER_TEMP/dtv-release.jks"
          chmod 600 "$RUNNER_TEMP/dtv-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dtv-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk_package="ndk;28.2.13676358"
          ndk_dir="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          for attempt in 1 2 3; do
            echo "Installing Android NDK 28.2 (attempt $attempt/3)..."
            if sdkmanager "$ndk_package" && test -x "$ndk_dir/ndk-build"; then
              echo "Android NDK 28.2 installed successfully."
              exit 0
            fi
            echo "::warning::NDK installation attempt $attempt failed; clearing incomplete package files before retry."
            rm -rf "$ndk_dir"
            if [ -d "$ANDROID_SDK_ROOT/.temp" ]; then
              find "$ANDROID_SDK_ROOT/.temp" -maxdepth 1 -type f -name '*.zip' -delete || true
              find "$ANDROID_SDK_ROOT/.temp" -maxdepth 1 -type f -name '*ndk*' -delete || true
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          echo "::error::Android NDK 28.2 could not be installed after 3 attempts."
          exit 1
      - name: Prepare Android TV launcher banner
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/prepare_tv_banner.py
      - name: Build Verified MPV Embed APK (armeabi-v7a, default)
        shell: bash
        run: |
          set -euo pipefail
          version_full=$(sed -n "s/^version: *['\"]\?\([^'\"]*\)['\"]\?$/\1/p" pubspec.yaml | head -n1)
          version="${version_full%%+*}"
          build_number=$((GITHUB_RUN_NUMBER + 558))
          python scripts/build_android.py --abi armeabi-v7a --player-engine mpv_embed --build-name "$version" --build-number "$build_number"
          apk=$(find dist/android -maxdepth 1 -type f -name "*-${version_full}-armeabi-v7a.apk" -print -quit)
          test -n "$apk" && test -f "$apk"
          output="dist/android/D TV-Android-v7a_v${version}+${build_number}_MPV.apk"
          cp "$apk" "$output"
          echo "Built official default (MPV Embed), version=${version}+${build_number}: $output"
      - uses: actions/upload-artifact@v4
        with:
          name: D TV-Android-v7a-MPV-Embed-Default
          path: |
            dist/android/D TV-Android-v7a_v*_MPV.apk
          if-no-files-found: error
          retention-days: 14

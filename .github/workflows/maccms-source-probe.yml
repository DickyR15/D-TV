name: MacCMS source endpoint probe

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/probe_maccms_sources.py"
      - ".github/workflows/maccms-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maccms-source-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Public API and bounded playback probe
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP client
        run: python -m pip install --upgrade requests

      - name: Probe public MacCMS endpoints
        run: |
          python scripts/probe_maccms_sources.py --output maccms-source-probe-report.json

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maccms-source-probe-report
          path: maccms-source-probe-report.json
          if-no-files-found: warn
          retention-days: 14

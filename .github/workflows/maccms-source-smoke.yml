name: MacCMS sources public smoke test

on:
  pull_request:
    paths:
      - "native/core/provider_maccms.go"
      - "native/core/provider_maccms_test.go"
      - ".github/workflows/maccms-source-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public MacCMS APIs and direct media
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          SOURCES = {
              "天堂": "https://caiji.dyttzyapi.com/api.php/provide/vod/",
              "速播": "https://subocj.com/api.php/provide/vod/",
              "量子": "https://cj.lziapi.com/api.php/provide/vod/from/lzm3u8/",
              "非凡": "https://api.ffzyapi.com/api.php/provide/vod/from/ffm3u8/",
              "豆瓣": "https://caiji.dbzy5.com/api.php/provide/vod/from/dbm3u8/at/josn/",
              "最大": "https://zuidazy.co/api.php/provide/vod/from/zuidam3u8/",
          }
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"

          def request(url, referer="", byte_range=None, limit=6 * 1024 * 1024):
              headers = {"User-Agent": UA, "Accept": "application/json,application/vnd.apple.mpegurl,*/*"}
              if referer:
                  headers["Referer"] = referer
              if byte_range:
                  headers["Range"] = byte_range
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=18) as response:
                  body = response.read(limit + 1)
                  if len(body) > limit:
                      raise RuntimeError("response exceeded size limit")
                  return response.status, response.headers.get("Content-Type", ""), body

          def fetch_json(base, params):
              url = base + ("&" if "?" in base else "?") + urllib.parse.urlencode(params)
              status, _, body = request(url, urllib.parse.urlsplit(base).scheme + "://" + urllib.parse.urlsplit(base).netloc + "/")
              if status != 200:
                  raise RuntimeError("API HTTP %s" % status)
              payload = json.loads(body.decode("utf-8-sig"))
              if not isinstance(payload, dict):
                  raise RuntimeError("API payload is not an object")
              return payload

          def rows(payload):
              for obj in (payload, payload.get("data") if isinstance(payload.get("data"), dict) else {}):
                  if not isinstance(obj, dict):
                      continue
                  values = obj.get("list") or obj.get("vod_list") or obj.get("items")
                  if isinstance(values, list):
                      return [x for x in values if isinstance(x, dict)]
              return []

          def probe_stream(raw_url, referer):
              parsed = urllib.parse.urlsplit(raw_url.strip())
              if parsed.scheme not in ("http", "https") or not parsed.netloc or not parsed.path.lower().endswith((".m3u8", ".mp4", ".m4v")):
                  raise RuntimeError("detail has no direct M3U8/MP4 URL")
              status, content_type, body = request(raw_url, referer, "bytes=0-1023", 1024 * 1024)
              if not 200 <= status < 300:
                  raise RuntimeError("media HTTP %s" % status)
              if parsed.path.lower().endswith(".m3u8"):
                  text = body.decode("utf-8-sig", "replace")
                  lines = [line.strip() for line in text.splitlines() if line.strip() and not line.startswith("#")]
                  if not lines:
                      raise RuntimeError("M3U8 has no media entries")
                  segment = urllib.parse.urljoin(raw_url, lines[0])
                  seg_status, seg_type, seg_body = request(segment, raw_url, "bytes=0-1023", 4096)
                  if not 200 <= seg_status < 300 or not seg_body:
                      raise RuntimeError("first HLS segment failed: HTTP %s" % seg_status)
                  return "playlist HTTP %s; segment HTTP %s (%s)" % (status, seg_status, seg_type or content_type)
              if not body:
                  raise RuntimeError("MP4 response is empty")
              return "MP4 HTTP %s (%s)" % (status, content_type)

          failures = []
          for name, base in SOURCES.items():
              referer = urllib.parse.urlsplit(base).scheme + "://" + urllib.parse.urlsplit(base).netloc + "/"
              try:
                  listing = fetch_json(base, {"ac": "list", "pg": 1})
                  catalog = rows(listing)
                  if not catalog:
                      raise RuntimeError("catalog list is empty")
                  sample = catalog[0]
                  source_id = str(sample.get("vod_id", "")).strip()
                  title = str(sample.get("vod_name", "")).strip()
                  if not source_id or not title:
                      raise RuntimeError("catalog item has no vod_id/vod_name")
                  search = fetch_json(base, {"ac": "detail", "wd": title[:48], "pg": 1})
                  if not rows(search):
                      raise RuntimeError("search returned no items for its own catalog title")
                  detail = fetch_json(base, {"ac": "detail", "ids": source_id})
                  detail_rows = rows(detail)
                  if not detail_rows:
                      raise RuntimeError("detail returned no row")
                  row = detail_rows[0]
                  blocks = str(row.get("vod_play_url", "")).split("$$$")
                  direct = None
                  for block in blocks:
                      for item in block.split("#"):
                          if "$" not in item:
                              continue
                          _, address = item.split("$", 1)
                          address = address.strip()
                          parsed = urllib.parse.urlsplit(address)
                          if parsed.scheme in ("http", "https") and parsed.netloc and parsed.path.lower().endswith((".m3u8", ".mp4", ".m4v")):
                              direct = address
                              break
                      if direct:
                          break
                  if not direct:
                      raise RuntimeError("detail has no direct M3U8/MP4 episode")
                  media_result = probe_stream(direct, referer)
                  print("PASS %s: list=%d, search=ok, detail=%s, %s" % (name, len(catalog), title[:40], media_result))
              except Exception as exc:
                  failures.append((name, str(exc)))
                  print("FAIL %s: %s" % (name, exc))

          if failures:
              print("\nFailed sources:")
              for name, error in failures:
                  print("- %s: %s" % (name, error))
              sys.exit(1)
          print("\nPASS: all six MacCMS sources returned catalog, search, detail and at least one direct media segment.")
          PY

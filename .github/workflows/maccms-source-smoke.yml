name: MacCMS sources public smoke test

on:
  pull_request:
    paths:
      - "native/core/provider_maccms.go"
      - "native/core/provider_maccms_test.go"
      - ".github/workflows/maccms-source-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe public MacCMS APIs and direct media
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          import urllib.parse
          import urllib.request

          SOURCES = {
              "天堂": [
                  "https://caiji.dyttzyapi.com/api.php/provide/vod/from/dyttm3u8/at/json/",
                  "https://beiyong.dyttzyapi.com/api.php/provide/vod/from/dyttm3u8/at/json/",
                  "https://caiji.dyttzyapi.com/api.php/provide/vod/at/json/",
                  "https://beiyong.dyttzyapi.com/api.php/provide/vod/at/json/",
                  "http://caiji.dyttzyapi.com/api.php/provide/vod/",
              ],
              "速播": [
                  "https://subocj.com/api.php/provide/vod/from/subm3u8/at/json/",
                  "https://subocj.com/api.php/provide/vod/at/json/",
              ],
              "量子": [
                  "https://cj.lziapi.com/api.php/provide/vod/",
                  "https://cj.lzcaiji.com/api.php/provide/vod/",
              ],
              "非凡": [
                  "https://api.ffzyapi.com/api.php/provide/vod/from/ffm3u8/at/json/",
                  "https://cj2.ffzyapi.com/api.php/provide/vod/from/ffm3u8/at/json/",
                  "https://api.ffzyapi.com/api.php/provide/vod/at/json/",
                  "http://api.ffzyapi.com/api.php/provide/vod/",
                  "http://cj2.ffzyapi.com/api.php/provide/vod/",
                  "https://cj.ffzyapi.com/api.php/provide/vod/",
              ],
              "豆瓣": [
                  "https://caiji.dbzy5.com/api.php/provide/vod/from/dbm3u8/at/josn/",
                  "http://caiji.dbzy5.com/api.php/provide/vod/from/dbm3u8/at/josn/",
                  "https://caiji.dbzy5.com/api.php/provide/vod/at/josn/",
                  "http://caiji.dbzy5.com/api.php/provide/vod/at/josn/",
                  "https://dbzy.tv/api.php/provide/vod/at/josn/",
              ],
              "最大": [
                  "https://api.zuidapi.com/api.php/provide/vod/",
                  "http://api.zuidapi.com/api.php/provide/vod/",
              ],
          }
          REFERERS = {
              "天堂": "https://dyttzy.tv/",
              "速播": "https://subocj.com/",
              "量子": "https://www.lzizy.com/",
              "非凡": "https://ffzy.tv/",
              "豆瓣": "https://dbzy.tv/",
              "最大": "https://zuida.xyz/",
          }
          SEARCH_DISABLED = {"豆瓣"}  # 豆瓣官方 FAQ 明確表示已關閉遠端搜尋
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"

          def request(url, referer="", byte_range=None, limit=6 * 1024 * 1024):
              headers = {"User-Agent": UA, "Accept": "application/json,application/vnd.apple.mpegurl,*/*"}
              if referer:
                  headers["Referer"] = referer
              if byte_range:
                  headers["Range"] = byte_range
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=15) as response:
                  body = response.read(limit + 1)
                  if len(body) > limit:
                      raise RuntimeError("response exceeded size limit")
                  return response.status, response.headers.get("Content-Type", ""), body

          def fetch_json(base, params, referer):
              url = base + ("&" if "?" in base else "?") + urllib.parse.urlencode(params)
              status, _, body = request(url, referer)
              if status != 200:
                  raise RuntimeError("API HTTP %s" % status)
              payload = json.loads(body.decode("utf-8-sig"))
              if not isinstance(payload, dict):
                  raise RuntimeError("API payload is not an object")
              return payload

          def rows(payload):
              for obj in (payload, payload.get("data") if isinstance(payload.get("data"), dict) else {}):
                  if not isinstance(obj, dict):
                      continue
                  values = obj.get("list") or obj.get("vod_list") or obj.get("items")
                  if isinstance(values, list):
                      return [x for x in values if isinstance(x, dict)]
              return []

          def test_api(base, referer, search_supported=True):
              listing = fetch_json(base, {"ac": "list", "pg": 1}, referer)
              catalog = rows(listing)
              if not catalog:
                  raise RuntimeError("catalog list is empty")
              sample = catalog[0]
              source_id = str(sample.get("vod_id", "")).strip()
              title = str(sample.get("vod_name", "")).strip()
              if not source_id or not title:
                  raise RuntimeError("catalog item has no vod_id/vod_name")
              search_result = "ok"
              if search_supported:
                  search = fetch_json(base, {"ac": "detail", "wd": title[:48], "pg": 1}, referer)
                  if not rows(search):
                      raise RuntimeError("search returned no items for its own catalog title")
              else:
                  search_result = "disabled upstream"
              detail = fetch_json(base, {"ac": "detail", "ids": source_id}, referer)
              detail_rows = rows(detail)
              if not detail_rows:
                  raise RuntimeError("detail returned no row")
              direct = None
              for block in str(detail_rows[0].get("vod_play_url", "")).split("$$$"):
                  for item in block.split("#"):
                      if "$" not in item:
                          continue
                      _, address = item.split("$", 1)
                      address = address.strip()
                      parsed = urllib.parse.urlsplit(address)
                      if parsed.scheme in ("http", "https") and parsed.netloc and parsed.path.lower().endswith((".m3u8", ".mp4", ".m4v")):
                          direct = address
                          break
                  if direct:
                      break
              if not direct:
                  raise RuntimeError("detail has no direct M3U8/MP4 episode")
              media_status, content_type, body = request(direct, referer, "bytes=0-1023", 1024 * 1024)
              if not 200 <= media_status < 300 or not body:
                  raise RuntimeError("media request returned HTTP %s" % media_status)
              parsed_media = urllib.parse.urlsplit(direct)
              media_result = "media HTTP %s (%s)" % (media_status, content_type)
              if parsed_media.path.lower().endswith(".m3u8"):
                  current_url = direct
                  current_body = body
                  final_segment_status = None
                  final_segment_type = ""
                  for depth in range(4):
                      playlist = current_body.decode("utf-8-sig", "replace")
                      lines = [line.strip() for line in playlist.splitlines() if line.strip()]
                      if not lines or "#EXTM3U" not in playlist[:512]:
                          raise RuntimeError("invalid HLS playlist")
                      if "#EXT-X-STREAM-INF" in playlist:
                          candidate = None
                          for index, line in enumerate(lines):
                              if line.startswith("#EXT-X-STREAM-INF"):
                                  candidate = next((x for x in lines[index + 1:] if not x.startswith("#")), None)
                                  break
                          if candidate is None:
                              raise RuntimeError("master playlist has no variant")
                          next_url = urllib.parse.urljoin(current_url, candidate)
                          next_status, next_type, next_body = request(next_url, current_url, "bytes=0-1023", 1024 * 1024)
                          if not 200 <= next_status < 300 or not next_body:
                              raise RuntimeError("HLS variant request failed: HTTP %s" % next_status)
                          current_url, current_body = next_url, next_body
                          continue
                      segment_path = next((x for x in lines if not x.startswith("#")), None)
                      if segment_path is None:
                          raise RuntimeError("media playlist has no segments")
                      segment_url = urllib.parse.urljoin(current_url, segment_path)
                      final_segment_status, final_segment_type, segment_body = request(segment_url, current_url, "bytes=0-1023", 4096)
                      if not 200 <= final_segment_status < 300 or not segment_body:
                          raise RuntimeError("first HLS media segment failed: HTTP %s" % final_segment_status)
                      if "mpegurl" in final_segment_type.lower() or segment_body.lstrip().startswith(b"#EXTM3U"):
                          current_url, current_body = segment_url, segment_body
                          continue
                      break
                  if final_segment_status is None or "mpegurl" in final_segment_type.lower():
                      raise RuntimeError("could not reach a media segment within four HLS playlist levels")
                  media_result = "playlist HTTP %s; media segment HTTP %s (%s)" % (media_status, final_segment_status, final_segment_type or content_type)
              return len(catalog), title, media_result, search_result

          failures = []
          for name, endpoints in SOURCES.items():
              passed = False
              errors = []
              for endpoint in endpoints:
                  try:
                      count, title, result, search_result = test_api(endpoint, REFERERS[name], name not in SEARCH_DISABLED)
                      print("PASS %s: endpoint=%s, list=%d, search=%s, detail=%s, %s" % (name, endpoint, count, search_result, title[:36], result))
                      passed = True
                      break
                  except Exception as exc:
                      errors.append("%s -> %s" % (endpoint, exc))
              if not passed:
                  failures.append((name, errors))
                  print("FAIL %s: all %d configured API endpoint(s) failed" % (name, len(endpoints)))
                  for error in errors:
                      print("  " + error)

          if failures:
              print("\nSources still needing endpoint investigation:")
              for name, errors in failures:
                  print("- " + name)
              sys.exit(1)
          print("\nPASS: all six MacCMS sources returned catalog, search, detail and at least one direct media response.")
          PY

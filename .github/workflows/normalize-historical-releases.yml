name: Normalize Historical Release Metadata

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "確認整理 D TV v1.0.1-v1.0.6 的 SHA-256 校驗碼與 SHA256SUMS.txt"
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

permissions:
  contents: write

concurrency:
  group: dtv-normalize-historical-releases
  cancel-in-progress: false

jobs:
  normalize:
    if: inputs.confirm == 'yes'
    name: Normalize v1.0.1-v1.0.6 release checksums
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize historical GitHub Releases
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: python scripts/normalize_release_metadata.py

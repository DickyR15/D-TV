name: Guipian source tests

on:
  pull_request:
    branches: [main]
    paths:
      - "native/core/provider_guipian.go"
      - "native/core/provider_guipian_test.go"
      - "native/core/app_preload.go"
      - "native/core/provider_huangguo.go"
      - "native/core/provider_media.go"
      - "native/core/app_categories.go"
      - "native/core/app_runtime.go"
      - "native/core/app_cover_metadata.go"
      - "lib/models.dart"
      - "native/core/app_stream.go"
      - "native/core/network_media.go"
      - ".github/workflows/guipian-live-probe.yml"

jobs:
  live-probe:
    if: github.event.pull_request.number == 29
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Run Guipian provider tests
        working-directory: native
        run: go test ./core -run '^TestGuipian' -count=1 -v

  windows-core:
    if: github.event.pull_request.number == 29
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Test shared Go core on Windows
        working-directory: native
        run: go test ./...
